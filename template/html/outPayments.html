<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=`, initial-scale=1.0">
    <title>Add Payment</title>
    <link rel="stylesheet" href="../css/outPayments.css">
    <script src="../js/outPayments.js" defer></script>
</head>
<body>
    <h1>Add Payment</h1>
    <main>
        <div id="type-selection-div" onchange="modeSwitcher(event)">
            <span>Choose payment type:</span>&nbsp;
            <label for="bill-payment">Bill payment</label>
            <input type="radio" name="payment-type" id="bill-payment" value="bill"/>
            <label for="general-expense">General expense</label>
            <input type="radio" name="payment-type" id="general-expense" value="general" />
        </div>
        <div id="main-content-div">
            <section id="payment-forms">
                <form id="bill">
                    <div>
                        <label for="name">Supplier Name</label>
                    </div>
                    <div>
                        <input type="text" id="name" list="supplier-name">
                        <datalist id="supplier-name"></datalist>
                    </div>
                    <div>
                        <label for="billNo">Bill Number</label>
                    </div>
                    <div>
                        <input type="text" id="billNo" list="bill-numbers">
                        <datalist id="bill-numbers"></datalist>
                    </div>
                    <div>
                        <label for="amount">Amount</label>
                    </div>
                    <div>
                        <input type="text" id="amount" onkeypress="validateInput(event)"/>
                    </div>
                    <div><button type="submit">Add</button></div>
                </form>
                <form class="hide" id="general"> 
                    <div><label for="beneficiary">Beneficiary Name</label></div>
                    <div><input type="text" id="beneficiary"></div>
                    <div><label for="purpose">Purpose</label></div>
                    <div><input type="text"></div>
                    <div><label for="amount">Amount</label></div>
                    <div><input type="text"></div>
                    <div><button type="submit">Add</button></div>
                </form>
            </section>
            <section id="display-unpaid-bills">
                <h2>Unpaid/partly paid Bills</h2>
            </section>
        </div>
    </main>
</body>
</html>
