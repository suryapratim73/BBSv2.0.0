<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal</title>
    <link rel="stylesheet" href="../css/customerPortal.css">

</head>

    <div id="chart-div">
        <h1>Chart section</h1>
    </div>

            </form>
        </div>
