<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BBS Kiosk — Sale</title>
    <link rel="stylesheet" href="/kiosk.css">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body class="kiosk-sale" style="--theme-primary: rebeccapurple; --theme-secondary: #fff;">
    <div class="kiosk-toolbar">
        <button class="btn-back" onclick="location.href='/'">← Exit</button>
        <span class="cart-badge" id="cart-badge">0 items</span>
    </div>

    <div class="kiosk-main" id="kiosk-main">
        <!-- Product Grid -->
        <div class="product-search">
            <input type="text" id="product-search" placeholder="Search products..." oninput="filterProducts()">
        </div>
        <div class="product-grid" id="product-grid">
            <p class="loading">Loading products...</p>
        </div>
    </div>

    <!-- Cart Panel (slides up) -->
    <div class="cart-panel" id="cart-panel">
        <div class="cart-header" onclick="toggleCart()">
            <span>🛒 Cart</span>
            <span id="cart-total">₹0.00</span>
        </div>
        <div class="cart-body" id="cart-body">
            <div class="cart-items" id="cart-items">
                <p class="empty-cart">Cart is empty</p>
            </div>
            <div class="cart-actions">
                <button onclick="clearCart()">Clear</button>
                <button class="btn-checkout" id="btn-checkout" onclick="checkout()" disabled>
                    Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div class="checkout-overlay hide" id="checkout-overlay">
        <div class="checkout-modal">
            <h2>Checkout</h2>
            <div class="checkout-summary" id="checkout-summary"></div>
            <!-- Customer selector — conditionally shown based on kiosk config -->
            <div class="checkout-customer" id="checkout-customer-section">
                <input type="text" id="customer-search" placeholder="Search customer by name or phone...">
                <div class="customer-results" id="customer-results"></div>
            </div>
            <!-- Anonymous walk-in note — shown when customer selector is disabled -->
            <div class="checkout-customer hide" id="checkout-anonymous-note">
                <p class="anonymous-label">🛒 Walk-in Sale</p>
                <p class="anonymous-hint">No customer selection required.</p>
            </div>
            <div class="checkout-payment">
                <label>Payment Received (₹):</label>
                <input type="number" id="payment-amount" placeholder="0.00" min="0" step="0.01">
            </div>
            <div class="checkout-actions">
                <button onclick="closeCheckout()">Cancel</button>
                <button class="btn-confirm" id="btn-confirm" onclick="confirmSale()" disabled>
                    Confirm Sale
                </button>
            </div>
        </div>
    </div>

    <!-- Success Toast -->
    <div class="toast hide" id="toast">✓ Sale completed!</div>

    <script src="/kiosk.js"></script>
</body>
</html>
