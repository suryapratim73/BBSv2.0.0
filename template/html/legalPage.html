<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal</title>
    <link rel="stylesheet" href="../../images/fontawesome-free-6.1.1-web/css/all.min.css">
    <link rel="stylesheet" href="../css/legalPage.css">
    <script src="../js/legalPage.js" defer></script>
</head>
<body>
    <header class="legal-top">
        <i class="fa-solid fa-scale-balanced"></i>
        <h1>Legal</h1>
        <p>App license and API terms of service — read anytime.</p>
    </header>
    <nav class="legal-tabs" role="tablist" aria-label="Legal documents">
        <button type="button" class="legal-tab selected" data-tab="app" role="tab" tabindex="0">App EULA</button>
        <button type="button" class="legal-tab" data-tab="api" role="tab" tabindex="0">API Terms of Service</button>
    </nav>
    <main class="legal-main">
        <div class="legal-pane" id="legal-pane-app" role="tabpanel"></div>
        <div class="legal-pane hide" id="legal-pane-api" role="tabpanel"></div>
    </main>
</body>
</html>
