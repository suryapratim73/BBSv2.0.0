<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Purchase</title>
    <script src="../js/purchaseTemplate.js" defer></script>
    <link rel="stylesheet" href="../css/purchaseTemplate.css" />
</head>

<body>
    <div id="page1" class="page " data-ui="purchase-page-supplier">
        <form onsubmit="addSupplier(event)" aria-labelledby="supplier-form-heading">
            <h2 id="supplier-form-heading">Add <span class="highlight">Supplier</span> details</h2>
            <div>
                <div><label for="name" class="highlight">Name:</label></div>
                <div><input type="text" onchange="selectSupplier(event)" required autofocus placeholder="compulsory feild" name="name" id="name" list="suppliers-dl" tabindex="0"/></div>
            </div>
            <div>
                <div><label for="address" class="highlight">Address:</label></div>
                <div><input type="text" required placeholder="compulsory feild" name="address" id="address" tabindex="0"/></div>
            </div>
            <div>
                <div><label for="phones" class="highlight">Phones:</label></div>
                <div>
                    <input type="text" required placeholder="compulsory feild" data-type="Number" name="phones" id="phones" onkeypress="validateInput(event)" aria-describedby="phones-hint" tabindex="0"/>
                    <button type="button" class="main-ui-btn" id="add-new-number" tabindex="-1" onclick="addNewNumber(event)" aria-label="Add new phone number">+</button>
                    <span id="phones-hint" class="sr-only">Enter phone number</span>
                </div>
            </div>
            <div>
                <div><label for="email" class="highlight">Email:</label></div>
                <div><input type="text" name="email" placeholder="optional feild with value must be xyz@xyz.xyz format" id="email" pattern="\S+@\S+\.\S+" tabindex="0"/></div>
            </div>
            <div>
                <div><label for="gst" class="highlight">GST Number:</label></div>
                <div><input type="text" placeholder="compulsory feild" required name="gst" id="gst" tabindex="0"/></div>
            </div>
            <div>
                <button type="button" data-cmd="cancel" onclick="proceedHandler(event)" tabindex="0">Cancel</button>
                <button type="submit" class="main-ui-btn" tabindex="0">Proceed</button>
            </div>
        </form>
    </div>
    <div id="page2" class="page hide" data-ui="purchase-page-items">
        <h2>Add <span class="highlight">Bill </span>Items</h2>
        <div id="table" role="table" aria-label="Bill items table">
            <div class="row head" role="row">
                <div class="col sm" role="columnheader"><p>Sl No.</p></div>
                <div class="col lg" role="columnheader"><p>Particular</p></div>
                <div class="col md"><p>HSN No</p></div>
                <div class="col md"><p>Quantity</p></div>
                <div class="col md"><p>Unit</p></div>
                <div class="col md"><p>Rate</p></div>
                <div class="col md"><p>Amount</p></div>
                <div class="col sm"><p>CGST</p></div>
                <div class="col sm"><p>SGST</p></div>
                <div class="col sm"><p>IGST</p></div>
                <div class="col md"><p>Total</p></div>
            </div>
            <div id="tbody" onmouseover="textRollAnnimation(event)" onchange="selectStock(event)" oninput="setAmtFeilds(event)" role="rowgroup">
                <div class="row row-control-div" id="add-item">
                    <button onclick="addRow(event)" class="main-ui-btn" aria-label="Add new row to bill items table" tabindex="0">+</button>
                </div>
            </div>
        </div>
        <div class="btn-container" onclick="proceedHandler(event)">
            <button data-cmd="cancel" tabindex="0">Cancel</button>
            <button data-cmd="back" tabindex="0">Back</button>
            <button data-cmd="next" class="main-ui-btn" tabindex="0">Proceed</button>
        </div>
    </div>
    <div id="page3" class="page hide" data-ui="purchase-page-headers">
        <form onsubmit="proceedHandler(event)" aria-labelledby="bill-headers-heading">
            <h2 id="bill-headers-heading">Add Purchase <span>Bill</span>Headers</h2>
            <div>
                <div><label for="billNo">Enter Bill NO:</label></div>
                <div><input type="text" placeholder="Compulsory feild" required id="billNo" name="billNo" tabindex="0"></div>
            </div>
            <div>
                <div><label for="billDate">Enter Bill Date:</label></div>
                <div><input type="date" placeholder="Compulsory feild" required id="billDate" name="billDate" tabindex="0"></div>
            </div>
            <div>
                <div><label for="freightName">Enter Freight Name:</label></div>
                <div><input type="text" name="freightName" onchange="selectFreight(event)" list="freightName-dl" id="freightName" tabindex="0"></div>
            </div>
            <div>
                <div><label for="freightCharge">Enter Freight Charge:</label></div>
                <div><input type="text" data-kind="charge" name="freightCharge" id="freightCharge" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"></div>
            </div>
            <!-- <div>
                <button id="more-feild-btn" type="button" onclick="showModal()">Add More Details</button>
                <div id="more-feild-menu" class="hide">
                    <div class="dash-mark"></div>
                    <div class="dash-mark"></div>
                    <div class="dash-mark"></div>
                    <div class="hide" id="more-feild-div"></div>
                </div>
            </div> -->
            <div class="btn-container"> 
                <button type="button" onclick="proceedHandler(event)" data-cmd="cancel" tabindex="0">Cancel</button>
                <button type="button" onclick="proceedHandler(event)" data-cmd="back" tabindex="0">Back</button>
                <button type="submit" class="main-ui-btn" data-cmd="next" tabindex="0">Proceed</button>
            </div>
        </form>
    </div>
    <div id="page4" class="page hide" data-ui="purchase-page-payment">
        <form onsubmit="saveData(event)" aria-labelledby="payment-details-heading">
            <h2 id="payment-details-heading">Add <span>Payment</span> details</h2>
            <div id="main">
                <div id="payment-div">
                    <div>
                        <div><label for="pay-method">Payment method:</label></div>
                        <div><select name="pay-method" id="pay-method" tabindex="0">
                            <option value="cash">Cash</option>
                            <option value="other">Other</option>
                        </select></div>
                    </div>
                    <div>
                        <div><label for="pay-desc">Payment details:</label></div>
                        <div><input type="text" placeholder="Cash/Cheque/Other details" name="pay-desc" id="pay-desc" tabindex="0"></div>
                    </div>
                    <div>
                        <div><label for="pay-date">Payment date:</label></div>
                        <div><input type="date" name="pay-date" id="pay-date" tabindex="0"></div>
                    </div>
                    <div>
                        <div><label for="pay-amt">Payment amount</label></div>
                        <div><input type="text" value="0" required oninput="updateSummaryDiv(event)" name="pay-amt" id="pay-amt" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"></div>
                    </div>
                    <div>
                        <div><label for="pay-recpt">Payment receiver:</label></div>
                        <div><input type="text" list="employee-to-supp" placeholder="Person receiving payment" name="pay-recpt" id="pay-recpt" tabindex="0"></div>
                    </div>
                </div>
                <div id="summary-div" role="region" aria-labelledby="bill-summary-heading">
                    <h2 id="bill-summary-heading">Bill Summary</h2>
                    <div>
                        <p class="red">Bill Amount:</p>
                        <p id="bill-amt">0</p>
                    </div>
                    <div>
                        <p class="red">Tax Amount:</p>
                        <p id="tax-amt">0</p>
                    </div>
                    <div id="pay-amt-div">
                        <p class="red">Payment Amount:</p>
                        <p id="summ-pay-amt">0</p>
                    </div>
                    <div>
                        <p class="red">Total Amount:</p>
                        <p id="total-amt">0</p>
                    </div>
                </div>
            </div>
            <div class="btn-container" onclick="proceedHandler(event)">
                <button type="button" data-cmd="cancel" tabindex="0">Cancel</button>
                <button type="button" data-cmd="back" tabindex="0">Back</button>
                <button type="submit" class="main-ui-btn" tabindex="0">Save</button>
            </div>
        </form>
    </div>

    <div class="cover hide"></div>
    <datalist id="stock-dl"></datalist>
    <datalist id="freightName-dl"></datalist>
    <datalist id="feild-labels">
        <!-- Add historic feild labels using js -->
    <datalist id="suppliers-dl"></datalist>
    </datalist>
    <datalist id="unit-dl">
    </datalist>
    <datalist id="employee-to-supp"></datalist>
    <template id="body-row-template">
        <div class="body row">
            <div class="col sm"><p>1</p></div>
            <div class="col lg"><input type="text" data-name="name" list="stock-dl" tabindex="0"/></div>
            <div class="col md"><input data-name="hsn" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>
            <div class="col md"><input data-name="quantity" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>
            <div class="col md"><input data-name="unit" type="text" list="unit-dl" tabindex="0"/></div>                            
            <div class="col md"><input data-name="rate" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col md"><p class="amt-p"></p></div>
            <div class="col sm"><input data-name="cgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col sm"><input data-name="sgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col sm"><input data-name="igst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col md"><p class="net-amt-p"></p></div>
        </div>
    </template>
    <template id="item-options">
        <div class="body-row-options">
            <button data-cmd="delete" tabindex="-1">Delete</button>
        </div>
    </template>
