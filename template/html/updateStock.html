<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Stock</title>
    <link rel="stylesheet" href="../css/updateStock.css" />
    <script src="../js/updateStock.js" defer></script>
</head>

<body>
    <nav>
        <h1>Update Stock Dialog</h1>
        <p>Add/Remove old stocks to maintain stocks.</p>
    </nav>
    <main>
        <form>
            <div>
                <label for="stock-name">Item name</label>
                <input type="text" list="stock-name" onchange="setSelectedStock(event)"/>
            </div>
            <div>
                <label for="update-qty">Update quantity</label>
                <input type="text" />
            </div>
            <div>
                <label for="update-price">Update price</label>
                <input type="text" />
            </div>
            <div>
                <label for="update-location">Set new location</label>
                <input type="text" />
            </div>
            <div>
                <button onclick="showModal()" disabled id="more-info" type="button">More Info</button>
            </div>
            <div><button type="submit">Update</button></div>
        </form>
    </main>
    <div class="modal hide" id="product-info">
        <form id="feild-map" onsubmit="saveFeildValues(event)">
            <div id="feild-container">
                <div>
                    <button type="button" onclick="addFeild(event)" id="add-feild">Add feild</button>
                </div>
            </div>
            <div id="btn-container">
                <button type="button" onclick="closeModal()">Cancel</button>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>
    <div class="cover hide" onclick="closeModal()"></div>
</body>

</html>
