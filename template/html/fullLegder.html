<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Ledger</title>
    <link rel="stylesheet" href="../css/fullLegder.css">
    <script src="../js/fullLegder.js" defer></script>
</head>
<body>
    <h1>Full Ladger</h1>
    <div id="contact-div">
        <table>
            <thead>
                <tr>
                    <th data-name="entryNo">Sl. No</th>
                    <th data-name="date">Date</th>
                    <th data-name="billNo">Bill Number</th>
                    <th data-name="billAmt">Bill Amount</th>
                    <th data-name="payments">Payments</th>
                    <th data-name="netDue">Net Balance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="cover hide"></div>
    <div class="modal hide">
        <header></header>
        <main>
            <table>
                <thead>
                    <tr>
                        <th data-name="itemNo">Sl No</th>
                        <th data-name="name">Item Name</th>
                        <th data-name="type">Item Type</th>
                        <th data-name="hsn">Item HSN</th>
                        <th data-name="quantity">Quantity</th>
                        <th data-name="unit">Unit</th>
                        <th data-name="rate">Rate</th>
                        <th data-name="tax">Tax</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </main>
        <footer></footer>
    </div>
</body>
</html>
