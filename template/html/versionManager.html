<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/versionManager.js" defer></script>
    <link rel="stylesheet" href="../css/versionManager.css">
    <title>Version Manager</title>
</head>
<body>
    <header role="banner">
        <h1>Version Manager</h1>
        <div>
            <label for="version-list">Select App Version: </label>
            <select name="versionList" id="version-list" onchange="initMainDiv(event)" aria-label="Select application version" tabindex="0"></select>
        </div>
    </header>
    <main role="main"></main>
    <template id="version-details-template">
        <div id="version-details">
            <div>
                <h2></h2>
                <div>
                    <p>Version Highlights</p>
                    <div>
                        <ul></ul>
                    </div>
                </div>
            </div>
            <div onclick="btnCtrl(event)" id="ctrl-btn">
                <button data-cmd="open-folder" aria-label="Open backup folder" tabindex="0">Open Backup Folder</button>
                <button data-cmd="restore" aria-label="Restore this version" tabindex="0">Restore version</button>
                <button onclick="btnCtrl(event)" data-cmd="delete-version" id="delete-version-btn" aria-label="Delete this version" tabindex="0">Delete Version</button>
            </div>
        </div>
    </template>
</body>
</html>
