<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Display</title>
    <script src="../js/showSale.js" defer></script>
    <link rel="stylesheet" href="../css/showSale.css">
</head>
<body>
    <header>
        <input type="text" placeholder="Type to search bill.." oninput="searchHandler(event)">
        <button data-cmd="toggle-filter-option">Filter</button>
        <div id="filter-options" class="hide">
            <div data-cmd="paid" class="option">
                <p data-cmd="paid">Paid</p>
                <div data-cmd="paid" class="dot deselect"></div>
            </div>
            <div data-cmd="unpaid" class="option">
                <p data-cmd="unpaid">Unpaid</p>
                <div data-cmd="unpaid" class="dot deselect"></div>
            </div>
            <div data-cmd="open" class="option">
                <p data-cmd="open">Open</p>
                <div data-cmd="open" class="dot deselect"></div>
            </div>
            <div data-cmd="close" class="option">
                <p data-cmd="close">Closed</p>
                <div data-cmd="close" class="dot deselect"></div>
            </div>
            <div data-cmd="all" class="option">
                <p data-cmd="all">All</p>
                <div data-cmd="all" class="dot select"></div>
            </div>
        </div>
    </header>
    <main>
        <section class="table">
            <div class="head row">
                <p data-name="date" class="col col1">Sl No</p>
                <p data-name="billNo" class="col col2">Bill Date</p>
                <p data-name="billNo" class="col col3">Bill Number</p>
                <p data-name="billAmt" class="col col4">Bill Amount</p>
                <p data-name="payment" class="col col5">Net Tax</p>
            </div>
        </section>
        <section id="emphasis-tables">
            <div class="table">
                <h2 class="table-header">Top Customer</h2>
            </div>
            <div class="table">
                <h2 class="table-header">Top Defaulter</h2>
            </div>
        </section>
    </main>
</body>
</html>
