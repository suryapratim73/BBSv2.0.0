<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Display</title>
    <script src="../js/showSale.js" defer></script>
    <link rel="stylesheet" href="../css/showSale.css">
</head>
<body>
    <header role="banner">
        <input type="text" oninput="_searchHandler(event)" placeholder="Type to search bill.." aria-label="Search bills" tabindex="0">
        <button data-cmd="toggle-filter-option" class="main-ui-btn" aria-label="Toggle filter options" aria-expanded="false" aria-controls="filter-options" tabindex="0">Filter</button>
        <div id="filter-options" class="hide" role="menu">
            <p data-cmd="paid" role="menuitem">Paid</p>
            <p data-cmd="unpaid" role="menuitem">Unpaid</p>
            <p data-cmd="open" role="menuitem">Open</p>
            <p data-cmd="close" role="menuitem">Closed</p>
            <p data-cmd="all" role="menuitem">All</p>
        </div>
    </header>
    <main role="main">
        <section class="table" role="table" aria-label="Sales records table">
            <div class="head row" role="row">
                <p data-name="date" class="col eq-space" role="columnheader">Sl No</p>
                <p data-name="billNo" class="col eq-space">Bill Number</p>
                <p data-name="billDate" class="col eq-space">Bill Date</p>
                <p data-name="billAmt" class="col eq-space">Bill Amount</p>
                <p data-name="payment" class="col eq-space">Net Tax</p>
            </div>
            <div id="tbody" role="rowgroup"></div>
        </section>
        <section id="emphasis-tables">
            <div class="table">
                <h2 class="table-header">Top Customer</h2>
            </div>
            <div class="table">
                <h2 class="table-header">Top Defaulter</h2>
                <div class="head row">
                    <p class="col eq-space">Name</p>
                    <p class="col eq-space">Due</p>
                </div>
                <div class="tbody"></div>
            </div>
        </section>
    </main>
    <template id="bill-view-modal-template">
        <div id="bill-view-modal">
            <div id="sec-1">
                <div data-name="name" class="bill-header">
                    <h3 class="label">Customer: </h3>
                    <h3 class="value"></h3>
                </div>
                <div data-name="gst" class="bill-header">
                    <h3 class="label">GST: </h3>
                    <h3 class="value"></h3>
                </div>
                <div data-name="billDate" class="bill-header">
                    <h3 class="label">Bill Date: </h3>
                    <h3 class="value"></h3>
                </div>
                <div data-name="billNo" class="bill-header">
                    <h3 class="label">Bill No: </h3>
                    <h3 class="value"></h3>
                </div>
            </div>
            <div id="sec-2" class="table">
                <div class="head row">
                    <p class="col eq-space">Sl No</p>
                    <p class="col eq-space">Particular</p>
                    <p class="col eq-space">Quantity</p>
                    <p class="col eq-space">Rate</p>
                </div>
                <div id="tbody"></div>
            </div>
            <div id="sec-3">
                <button onclick="closeModal(event)" tabindex="0">Close</button>
            </div>
        </div>
    </template>
    <template id="body-row-template">
        <div class="body row">
            <p data-name="slno" class="eq-space col"></p>
            <p data-name="name" class="eq-space col"></p>
            <p data-name="quantity" class="eq-space col"></p>
            <p data-name="rate" class="eq-space col"></p>
        </div>
    </template>
</body>
</html>
