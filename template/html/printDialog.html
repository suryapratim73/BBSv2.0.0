<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Dialog Box</title>
    <link rel="stylesheet" href="../css/printDialog.css">
    <script src="../js/printDialog.js" defer></script>
</head>
<body class="modal" role="dialog" aria-modal="true" aria-labelledby="print-dialog-heading">
    <h1 id="print-dialog-heading">Print options</h1>
    <form onsubmit="printcmd(event)" aria-labelledby="print-dialog-heading">
        <div>
            <div>
                <label for="printer-list">Select Printer</label>
                <input id="printer-list" name="printer-list" onclick="resetInput(event)" list="printer-names" aria-label="Select printer from list" tabindex="0" />
            </div>
            <div>
                <fieldset>
                    <legend>Document label</legend>
                    <div>
                        <input type="checkbox" data-copy="first" checked id="buyer-copy" value="Original Buyer's Copy" tabindex="0"/>
                        <label for="buyer-copy"> Original Buyer's Copy</label>
                    </div>
                    <div>
                        <input type="checkbox" data-copy="second" id="transport-copy" value="Transporter's Copy" tabindex="0"/>
                        <label for="transport-copy"> Transporter's Copy</label>
                    </div>
                    <div>
                        <input type="checkbox" data-copy="third" checked id="book-copy" value="Book Copy" tabindex="0"/>
                        <label for="book-copy"> Book Copy</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Additional options</legend>
                    <div>
                        <label for="no-of-copies">Number Of Copies</label>
                        <input id="no-of-copies" name="no-of-copies" type="number" value="1" tabindex="0" />
                    </div>
                    <div>
                        <label for="paper-size">Paper Size</label>
                        <select name="paper-size" id="paper-size" tabindex="0">
                            <option selected value="A4">A4</option>
                            <option value="A5">A5</option>
                            <option value="A7">A7</option>
                        </select>
                    </div>
                    <div>
                        <label for="print-orientation">Print Orientation</label>
                        <select name="print-orientation" id="print-orientation" tabindex="0">
                            <option selected value="3">Portrait</option>
                            <option value="4">Landscape</option>
                        </select>
                    </div>
                </fieldset>
            </div>
        </div>
        <div>
            <button type="submit" class="main-ui-btn hover top right" data-msg="Continue to print (Ctrl+Enter)" data-name="print-btn" tabindex="0">Continue to Print</button>
            <button type="button" class="hover top right" data-msg="Cancel & Close (Escape)" data-name="print-cancel-btn" tabindex="0">Cancel</button>
        </div>
    </form>
    <datalist id="printer-names"></datalist>
</body>
</html>
