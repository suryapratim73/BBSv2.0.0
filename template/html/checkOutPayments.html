<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outward payments</title>
    <link rel="stylesheet" href="../css/checkOutPayments.css">
    <script src="../js/checkOutPayments.js" defer></script>
</head>
<body>
    <header>
        <button class="main-ui-btn" id="filter-btn">Filter</button>
        <div id="filter" class="hide">
            <button data-time="1">1 month</button>
            <button data-time="3">3 months</button>
            <button data-time="6">6 months</button>
            <button data-time="12.17">1 year</button>
            <button data-time="*" class="selection">all</button>
        </div>
    </header>
    <main>
        <div id="table">
            <div class="head row">
                <p class="col eq-space">Sl No.</p>
                <p class="col eq-space">Beneficiary Name</p>
                <p class="col eq-space">Type of payment</p>
                <p class="col eq-space">Amount</p>
                <p class="col eq-space">Date</p>
            </div>
            <div id="tbody"></div>
        </div>
    </main>
</body>
</html>
