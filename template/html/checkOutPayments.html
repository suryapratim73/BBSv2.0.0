<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outward payments</title>
    <link rel="stylesheet" href="../css/checkOutPayments.css">
    <script src="../js/checkOutPayments.js" defer></script>
</head>
<body>
    <header>
        <button class="main-ui-btn hover bottom" id="filter-btn" data-msg="Filter payments by time period" tabindex="0">Filter</button>
        <div id="filter" class="hide">
            <button data-time="1" data-msg="Show last 1 month" class="hover bottom" tabindex="0">1 month</button>
            <button data-time="3" data-msg="Show last 3 months" class="hover bottom" tabindex="0">3 months</button>
            <button data-time="6" data-msg="Show last 6 months" class="hover bottom" tabindex="0">6 months</button>
            <button data-time="12.17" data-msg="Show last 1 year" class="hover bottom" tabindex="0">1 year</button>
            <button data-time="*" class="selection hover bottom" data-msg="Show all payments" tabindex="0">all</button>
        </div>
    </header>
    <main>
        <div id="table">
            <div class="head row">
                <p class="col eq-space">Sl No.</p>
                <p class="col eq-space">Beneficiary Name</p>
                <p class="col eq-space">Type of payment</p>
                <p class="col eq-space">Amount</p>
                <p class="col eq-space">Date</p>
            </div>
            <div id="tbody"></div>
        </div>
    </main>
</body>
</html>
