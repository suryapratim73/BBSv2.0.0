<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Road Challan</title>
    <link rel="stylesheet" href="../css/roadChallan.css">
    <script src="../js/roadChallan.js" defer></script>
</head>
<body>
    <nav role="navigation" aria-label="Road challan form navigation">
        <h2>Road Challan Form</h2>
    </nav>
    <main role="main"></main>
    <template id="page1-template">
        <form onsubmit="initRoadChallan(event)" class="page page1" aria-labelledby="challan-header-heading">
            <h2 id="challan-header-heading">Challan Header</h2>
            <div>
                <div>
                    <label for="consignee">Consignee</label>
                </div>
                <div>
                    <input type="text" required id="consignee" onchange="setFeilds(event)" data-colname="Consignee" name="consignee" list="consignee-list">
                </div>
            </div>
            <div>
                <div>
                    <label for="consigneeGST">GST</label>
                </div>
                <div>
                    <input type="text" required id="consigneeGST" data-colname="Consignee GST" name="consigneeGST">
                </div>
            </div>
            <div>
                <div>
                    <label for="consigneeAddress">Address</label>
                </div>
                <div>
                    <input type="text" required id="consigneeAddress" data-colname="Consignee Address" name="consigneeAddress">
                </div>
            </div>
            <div>
                <div>
                    <label for="delNoteNo">Delivery Note No.</label>
                </div>
                <div>
                    <input type="text" data-colname="Delivery Note No." required id="delNoteNo" name="delNoteNo">
                </div>
            </div>
            <div>
                <div>
                    <label for="delDate">Dispatch Date</label>
                </div>
                <div>
                    <input type="date" data-colname="Dispatch Date" required id="delDate" name="delDate">
                </div>
            </div>
            <div>
                <button type="button" class="main-ui-btn" onclick="addNewFeild()" id="new-feild-btn" aria-label="Add new custom field">+</button>
            </div>
            <div>
                <button type="submit" class="main-ui-btn">Next</button>
                <button onclick="ipcRenderer.send('close','Road-Challan-Generator')">Cancel</button>
            </div>
        </form>
    </template>
    <template id="page2-template">
        <div class="page page2">
            <div class="table" role="table" aria-label="Road challan items table">
                <div class="row head" role="row">
                    <div class="col eq-space" role="columnheader"><p>Sl. No</p></div>
                    <div class="col eq-space" role="columnheader"><p>Stock Name</p></div>
                    <div class="col eq-space"><p>HSN</p></div>
                    <div class="col eq-space"><p>Quantity</p></div>
                    <div class="col eq-space"><p>Unit</p></div>
                    <div class="col eq-space"><p>Rate</p></div>
                    <div class="col eq-space"><p>Amount</p></div>
                </div>
                <div id="tbody" onclick="deleteRow(event)" onmouseover="showDeleteBTN(event)" class="hide-scrollbar" role="rowgroup">
                    <div class="row">
                        <button onclick="addRow(event)" class="main-ui-btn" id="add-new-row" aria-label="Add new item row">+</button>
                    </div>
                </div>
            </div>
            <div>
                <button onclick="ipcRenderer.send('close','Road-Challan-Generator')">Cancel</button>
                <button onclick="showPage1()" id="back-to-page1">Back</button>
                <button onclick="generateRoadChallan(event)" class="main-ui-btn" id="generate-challan">Generate</button>
            </div>
        </div>
    </template>
    <template id="new-feild-template">
        <form onsubmit="newFeildToNewEmp(event)" class="page2-elem">
            <div>
                <div><label for="key">Feild Name</label></div>
                <div><input type="text" id="key" name="key"></div>
            </div>
            <div>
                <div><label for="val">Feild Value</label></div>
                <div><input type="text" id="val" name="val"></div>
            </div>
            <div>
                <div>
                    <button type="submit" class="main-ui-btn">Add</button>
                    <button type="button" onclick="showPage1()">Cancel</button>
                </div>
            </div>
        </form>
    </template>
    <template id="body-row-template">
        <div class="body row">
            <div class="col eq-space"><p></p></div>
            <div class="col eq-space"><input data-colname="Product Name" type="text" onchange="selectStock(event)" data-name="stock-name" list="stock-names" /></div>
            <div class="col eq-space"><input data-colname="HSN" data-name="hsn" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>
            <div class="col eq-space"><input data-colname="Quantity" data-name="qty" oninput="calculateAmt(event)" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>
            <div class="col eq-space"><input data-colname="Unit" data-name="unit" type="text" list="unit-dl" oninput="calculateAmt(event)" /></div>                            
            <div class="col eq-space"><input data-colname="Rate" data-name="standardSellPrice" oninput="calculateAmt(event)" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>                            
            <div class="col eq-space"><p class="amt"></p></div>
        </div>
    </template>
    <template id="body-row-options-template">
        <div class="body-row-options">
            <button data-cmd="DELETE" type="button" tabindex="-1">Delete Row</button>
        </div>
    </template>
    <datalist id="stock-names"></datalist>
    <datalist id="unit-dl"></datalist>
    <datalist id="consignee-list"></datalist>
</body>
</html>
