<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Page</title>
    <link rel="stylesheet" href="../css/salePage.css">
    <script src="../js/salePage.js" defer></script>
</head>
<body>
    <h1 id="page-header" data-ui="page-header"></h1>
    <form data-ui="sale-form" onsubmit="proceedOrFinishHandler(event)" role="main">
        <main onchange="selectionHandler(event)" oninput="fuzzySearchHandler(event)"></main>
        <footer></footer>
    </form>
    <template id="page-1-template">
        <div id="page-1" class="page" data-ui="sale-page-customer" data-pageno="1" aria-labelledby="page-1-title">
            <div>
                <div>
                    <label for="name" class="highlight" id="page-1-title">Name: </label>
                </div>
                <div class="row1">
                    <input required type="text" id="name" spellcheck="false" name="name" autofocus data-name="name" list="customer-names" tabindex="0" placeholder="Search by name, phone, gst and email" data-usefuzzysearch="true" data-tablename="customer" />
                </div>
            </div>
            <div>
                <div>
                    <label for="address" class="highlight">Address: </label>
                </div>
                <div class="row1">
                    <input required id="address" type="text" name="address" data-name="address" tabindex="0"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="phones" class="highlight">Phone:</label>
                </div>
                <div class="row1">
                    <input type="text" list="customer-phones" placeholder="Pattern '+country code'+<SPACE>+10 digit number" pattern="(\+?\d+ ?)*\d{4,5} *\d{4,5}" name="phones" data-name="phones" data-type="Number" id="phones" onkeypress="validateInput(event)" tabindex="0"/>
                    <button id="add-new-phone" type="button" tabindex="-1" onclick="addPhone(event)" aria-label="Add new phone number">+</button>
                </div>
            </div>
            <div>
                <div>
                    <label for="email" class="highlight">Customer Email</label>
                </div>
                <div class="row1">
                    <input name="email" pattern="\S+@\S+\.\S+" placeholder="Example: xyz@xyz.xyz" type="text" data-name="email" id="email" tabindex="0"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="gst" class="highlight">GST Number</label>
                </div>
                <div class="row1">
                    <input name="gst" onkeypress="upperCaseInput(event)" pattern="^\d{2}[A-Z]{5}\d{4}[A-Z]{1}\w{1}Z\w{1}$" type="text" data-name="gst" id="gst" tabindex="0"/>
                </div>
            </div>
        </div>
    </template>
    <template id="page-2-template">
        <div id="page-2" class="page" data-ui="sale-page-details" data-pageno="2">
            <div>
                <div>
                    <label for="billDate" class="highlight">Date: </label>
                </div>
                <div class="row1">
                    <input type="date" id="billDate" required name="billDate" data-name="billDate" tabindex="0"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="orderRef" class="highlight">Order Reference:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="orderRef" name="orderRef" id="orderRef" placeholder="optional" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="ewayBill" class="highlight">E-Way Bill:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="ewayBill" name="ewayBill" id="ewayBill" placeholder="optional" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="stateNcode" class="highlight">State & Code:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="stateNcode" name="stateNcode" id="stateNcode" placeholder="optional" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="placeOfSupply" class="highlight">Place Of Supply:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="placeOfSupply" name="placeOfSupply" id="placeOfSupply" placeholder="optional" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="billType" class="highlight hover bottom" data-msg="Press F2 to edit bill type">Bill Type: </label>
                </div>
                <div class="row1">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-type-regular">Regular: </label>
                            <input type="radio" checked required data-name="billType" name="billType" id="bill-type-regular" value="regular" data-type="select-bill-type" tabindex="0"/>
                        </div>
                        <div>
                            <label for="bill-type-monthly">Monthly: </label>
                            <input type="radio" data-name="billType" name="billType" id="bill-type-monthly" value="monthly" tabindex="0"/>
                        </div>
                        <div>
                            <label for="bill-type-scrap">Scrap: </label>
                            <input type="radio" data-name="billType" name="billType" id="bill-type-scrap" value="scrap" tabindex="0"/>
                        </div>
                        <div>
                            <label for="bill-type-proforma">Proforma: </label>
                            <input type="radio" data-name="billType" name="billType" id="bill-type-proforma" value="proforma" tabindex="0"/>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="bill-number-regular" class="highlight">Bill Number: </label>
                </div>
                <div class="row1 bill-number regular">
                    <input name="billNo" id="bill-number-regular" required type="text" data-name="billNo" tabindex="0"/>
                </div>
                <div class="row1 hide bill-number monthly">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-number-reserve">Reserved: </label>
                            <input type="radio" required data-name="billNo" disabled  name="billNo" id="bill-number-reserve" value="reserve" tabindex="0"/>
                        </div>
                        <div>
                            <input type="checkbox" name="autoBill" data-name="autoBill" disabled id="auto-bill" tabindex="0">
                            <label for="auto-bill">Auto Bill</label>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label class="highlight">Bill Status</label>
                </div>
                <div class="row1">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-status-open">Open: </label>
                            <input type="radio" required data-name="billStatus"  name="billStatus" id="bill-status-open" value="open" tabindex="0"/>
                        </div>
                        <div>
                            <label for="bill-status-close">Close: </label>
                            <input type="radio" data-name="billStatus" checked name="billStatus" id="bill-status-close" value="close" tabindex="0"/>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-to" class="highlight">Ship to: </label>
                </div>
                <div class="row1">
                    <input type="text" list="ship-info-dl" onchange="setShipInfo(event)" name="shipTo" id="ship-to" data-name="shipTo" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-addr" class="highlight">Shipping address</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipAddr" id="ship-addr" data-name="shipAddr" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-phone" class="highlight">Consignee contact</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipPh" id="ship-phone" data-name="shipPh" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-gst" class="highlight">Consignee GST</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipGST" id="ship-gst" data-name="shipGST" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="delivery-mode" class="highlight">Delivery Mode: </label>
                </div>
                <div class="row1">
                    <select name="deliveryType" id="delivery-mode" onchange="assignDeliveryOptions(event)" required type="text" data-name="deliveryType" tabindex="0">
                        <option value="hand">Hand</option>
                        <option value="transport">Transport</option>
                    </select>
                </div>
            </div>
            <div id="transport-div" class="retractable-div-container hide">
                <div onclick="execRetractHandler(event)">
                    <button tabindex="-1" type="button" class="hide">Show</button>
                    <button tabindex="-1" type="button">Hide</button>
                </div>
            </div>
        </div>
    </template>
    <template id="page-3-template">
        <div id="page-3" class="page" data-ui="sale-page-items" data-pageno="3">
            <div id="table" role="table" aria-label="Bill items table">
                <div class="row head" role="row">
                    <div class="col sm" role="columnheader"><p>Sl No.</p></div>
                    <div class="col lg" role="columnheader"><p>Particular</p></div>
                    <div class="col md"><p>HSN No</p></div>
                    <div class="col md"><p>Quantity</p></div>
                    <div class="col md"><p>Unit</p></div>
                    <div class="col md"><p>Rate</p></div>
                    <div class="col md"><p>Amount</p></div>
                    <div class="col sm"><p>CGST</p></div>
                    <div class="col sm"><p>SGST</p></div>
                    <div class="col sm"><p>IGST</p></div>
                    <div class="col md"><p>Total</p></div>
                </div>
                <!-- <div id="tbody" onmouseover="textRollAnnimation(event)" class="hide-scrollbar" oninput="calculateAmounts(event)" onchange="selectionHandler(event)" role="rowgroup"> -->
                <div id="tbody" onmouseover="textRollAnnimation(event)" class="hide-scrollbar" oninput="calculateAmounts(event)" onclick="clickOrFocusinHandler(event)" onfocus="clickOrFocusinHandler(event)" role="rowgroup">
                    <div class="row row-control-div" id="add-item">
                        <button type="button" class="main-ui-btn hover bottom right" onclick="addRow(event)" aria-label="Add new item row" data-msg="Add new item row (Ctrl++)" tabindex="0">+</button>
                    </div>
                </div>
            </div>
            <div id="display-section">
                <div>
                    <p>Sold Qty:</p>
                    <p class="highlight" data-name="netQty">0</p><span>Kg</span>
                </div>
                <div>
                    <p>Amt:</p>
                    <span>Rs.</span><p class="highlight" data-name="netAmt">0</p>
                </div>
                <div>
                    <p>Tax:</p>
                    <span>Rs.</span><p class="highlight" data-name="netAmt">0</p>
                </div>
                <div>
                    <p>Amt with Tax:</p>
                    <span>Rs.</span><p class="highlight" data-name="netAmtTax">0</p>
                </div>
            </div>
        </div>
    </template>
    <!-- Scrap Sale Page 3 — simplified Qty + Rate with 2% TDS -->
    <template id="page-3-scrap-template">
        <div id="page-3-scrap" class="page" data-ui="sale-page-items-scrap" data-pageno="3">
            <div>
                <div>
                    <label for="scrap-qty" class="highlight">Quantity (Kg): </label>
                </div>
                <div>
                    <input type="number" id="scrap-qty" name="scrapQty" placeholder="Enter weight in Kg" min="0.01" step="0.01" oninput="scrapCalc()" tabindex="0" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="scrap-rate" class="highlight">Rate (₹/Kg): </label>
                </div>
                <div>
                    <input type="number" id="scrap-rate" name="scrapRate" placeholder="Enter rate per Kg" min="0.01" step="0.01" oninput="scrapCalc()" tabindex="0" required>
                </div>
            </div>
            <div id="scrap-summary-div" class="hide">
                <h3>Tax Summary</h3>
                <div><span>Taxable Value:</span><span id="scrap-taxable">₹0.00</span></div>
                <div><span>GST (18%):</span><span id="scrap-gst">₹0.00</span></div>
                <div><span>Scrap TDS (2%):</span><span id="scrap-tds">₹0.00</span></div>
                <div class="scrap-total"><span>Total:</span><span id="scrap-total">₹0.00</span></div>
            </div>
        </div>
    </template>
    <template id="page-4-template">
        <div id="page-4" class="page" data-ui="sale-page-payment" data-pageno="4">
            <div id="left-section">
                <div id="payment-div" oninput="updateBillValue(event)" onkeypress="validateInput2(event)">
                    <div id="payment-mode">
                        <label for="payment-mode">Select payment mode:</label>
                        <select id="payment-mode" onchange="showPaymentMode(event)" aria-label="Select payment mode" tabindex="0">
                            <option value="due" selected>Due</option>
                            <option value="cash">Cash</option>
                            <option value="check">Check</option>
                            <option value="online">NEFT</option>
                        </select>
                    </div>
                    <div id="cash-payment" class="hide payment-detail">
                        <div>
                            <p>Enter amount</p>
                            <input data-type="Number" value="0" data-subtype="price" data-name="payment" tabindex="0"/>
                        </div>
                    </div>
                    <div id="check-payment" class="hide payment-detail">
                        <div>
                            <p>Bank Name</p>
                            <input type="text" data-name="bankName" tabindex="0"/>
                        </div>
                        <div>
                            <p>Bank Branch</p>
                            <input type="text" data-name="bankBranch" tabindex="0"/>
                        </div>
                        <div>
                            <p>Account No.</p>
                            <input type="text" data-subtype="price" data-name="bankACNo" data-type="Number" onkeypress="validateInput(event)" tabindex="0"/>
                        </div>
                        <div>
                            <p>Check No.</p>
                            <input type="text" data-subtype="price" data-name="chkNo" data-type="Number" onkeypress="validateInput(event)" tabindex="0"/>
                        </div>
                        <div>
                            <p>Amount paid</p>
                            <input type="text" value="0" data-name="payment" data-subtype="price" data-type="Number" onkeypress="validateInput(event)" tabindex="0"/>
                        </div>
                        <div>
                            <p>Mark as paid</p>
                            <select type="text" data-name="paymentStatus" onchange="updatePayStatus(event)" tabindex="0">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div id="online-payment" class="hide payment-detail">
                        <div>
                            <p>Bank Name</p>
                            <input type="text" data-name="bankName" tabindex="0"/>
                        </div>
                        <div>
                            <p>Transaction Ref.</p>
                            <input type="text" data-name="bankTrnRef" tabindex="0"/>
                        </div>
                        <div>
                            <p>Amount paid</p>
                            <input type="text" value="0" data-name="payment" data-subtype="price" data-type="Number" onkeypress="validateInput(event)" tabindex="0"/>
                        </div>
                        <div>
                            <p>Mark as paid</p>
                            <select type="text" data-name="paymentStatus" onchange="updatePayStatus(event)" tabindex="0">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="grp-btn-div">
                    <button data-cmd="grp-item" disabled onclick="showItemMergeOpts()" type="button" tabindex="0">Show Item Grouping Options</button>
                </div>
            </div>
            <div id="right-section">
                <div id="summary-div" role="region" aria-labelledby="bill-summary-label">
                    <div>
                        <p id="bill-summary-label">Bill Amount</p>
                        <p data-name="netAmtTax" class="highlight">0</p>
                    </div>
                    <div>
                        <p>Delivery Charge</p>
                        <p data-name="delCharge" class="highlight">0</p>
                    </div>
                    <div id="netAmtTaxDel-div">
                        <p>Net Amount</p>
                        <p data-name="netAmtTaxDel" class="highlight">0</p>
                    </div>
                    <div>
                        <p>Net Payment</p>
                        <p data-name="paymentAmt" class="highlight">0</p>
                    </div>
                    <div>
                        <p>Net Due</p>
                        <p data-name="dueAmt" class="highlight">0</p>
                    </div>
                    <div>
                        <p>Net Return</p>
                        <p data-name="return" class="highlight">0</p>
                    </div>
                </div>
                <div id="preview-action-container">
                    <button type="button" onclick="gerneratPreview()">Generate Preview</button>
                </div>
            </div>
        </div>
    </template>
    <template id="footer-template">
        <div id="btn-container">
            <button type="button" data-type="displaySection" onclick="displaySection()" class="hide hover top right" data-msg="Show bill summary (Ctrl+S)" tabindex="0">Summary</button>
            <button type="button" data-type="cancel" onclick="cancelAction()" class="hide hover top right" data-msg="Cancel and close (Esc)" tabindex="0">Cancel</button>
            <button type="button" data-type="back" onclick="proceedOrFinishHandler(event)" class="hide hover top right" data-msg="Go back to previous step (Ctrl+←)" tabindex="0">Back</button>
            <button type="submit" data-type="proceed" class="main-ui-btn hide hover top right" data-msg="Proceed to next step (Ctrl+Enter)" tabindex="0">Proceed</button>
            <button type="button" data-type="grp-pg-btn" onclick="showPage4(event,'cancel-grp')" class="main-ui-btn hide hover top right" data-msg="Cancel item grouping" tabindex="0">Cancel Grouping</button>
            <button type="button" data-type="grp-pg-btn" onclick="showPage4(event,'cnf-grp')" class="main-ui-btn hide hover top right" data-msg="Confirm item grouping" tabindex="0">Done</button>
            <button type="button" data-type="print" class="main-ui-btn hide hover top right" onclick="showPrintDialog()" data-msg="Print bill (Ctrl+P)" tabindex="0">Print</button>
            <button type="button" data-type="save-order" class="main-ui-btn hide hover top right" onclick="saveAsOrder(event)" data-msg="Save as order for later (Ctrl+Shift+S)" tabindex="0">Save as Order</button>
            <button type="button" data-type="save" class="main-ui-btn hide hover top right" onclick="saveExit(event)" data-msg="Save and exit (Ctrl+Enter / Ctrl+S)" tabindex="0">Save & Exit</button>
        </div>
    </template>
    <template id="body-row-template">
        <div class="body row" tabindex="0">
            <div class="col sm"><p>1</p></div>
            <div class="col lg"><input type="text" data-name="name" list="stock-names" tabindex="0" data-usefuzzysearch="true" data-tablename="stock" /></div>
            <div class="col md"><input data-name="hsn" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>
            <div class="col md"><input data-name="qty" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>
            <div class="col md"><input data-name="unit" type="text" list="unit-dl" tabindex="0"/></div>                            
            <div class="col md"><input data-name="standardSellPrice" list="rate-list" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col md"><p class="amt"></p></div>
            <div class="col sm"><input data-name="cgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col sm"><input data-name="sgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col sm"><input data-name="igst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0"/></div>                            
            <div class="col md"><p class="amt-with-tax"></p></div>
            <div class="desc-div hide">
                <input type="text" data-name="desc" placeholder="Add product description" tabindex="0"/>
                <div onclick="addDescToItem(event)">
                    <button data-cmd="cnf" class="desc-cnf-btn hover top left" data-msg="Confirm description (Shift+Enter)" tabindex="-1">&#10004;</button>
                    <button data-cmd="rej" class="desc-rej-btn hover top left" data-msg="Reject description (Shift+Del)" tabindex="-1">&#10060;</button>
                </div>
            </div>
        </div>
    </template>
    <template id="summary-div-template">
        <div id="page3-summary-div">
            <div>
                <div id="product-summary">
                    <div class="summary-col">
                        <div>
                            <div>
                                <h2>Item Summary</h2>
                            </div>
                        </div>
                        <div>
                            <div>
                                <p>Item:</p>
                                <p class="blue" data-name="name"></p>
                            </div>
                            <div>
                                <p>Available Qty:</p>
                                <p class="blue" data-name="quantity"></p>
                            </div>
                            <div>
                                <p>Buy Price:</p>
                                <p class="blue" data-name="buyPrice"></p>
                            </div>
                            <div>
                                <p>Last Sell Price:</p>
                                <p class="blue" data-name="lastSellPrice">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="summary-col">
                        <div id="graph-container"></div>
                        <div id="statistical-info">
                            <div>
                                <p>Standard Sell Price:</p>
                                <p class="blue" data-name="standardSellPrice">0</p>
                            </div>
                            <div>
                                <p>Discounted Rate:</p>
                                <p class="blue" data-name="discountedRate">0</p>
                            </div>
                            <div>
                                <p>Special Sell Price:</p>
                                <p class="blue" data-name="specialPrice">0</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="bill-summary">
                    <h2>Transaction Summary</h2>
                    <div>
                        <p>Sold Qty:</p>
                        <p class="highlight" data-name="netQty">0</p>
                    </div>
                    <div>
                        <p>Amt:</p>
                        <p class="highlight" data-name="netAmt">0</p>
                    </div>
                    <div>
                        <p>Amt with Tax:</p>
                        <p class="highlight" data-name="netAmtTax">0</p>
                    </div>
                </div>
            </div>
            <div>
                <button type="button" class="main-ui-btn hover top right" data-msg="Close" onclick="dismissSummary()">Dismiss</button>
            </div>
        </div>
    </template>
    <template id="transport-retractable-div-template">
        <div class="retractable-div" data-collapsed="false">
            <div>
                <div>
                    <label for="transport-name" class="highlight">Transport Name: </label>
                </div>
                <div class="row1">
                    <input id="transport-name" list="transport-dl" name="transportName" placeholder="compulsory feild" required type="text" data-name="transportName" tabindex="0" data-usefuzzysearch="true" data-tablename="transporter"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-address" class="highlight">Transport Address: </label>
                </div>
                <div class="row1">
                    <input id="transport-address" name="transportAddress" type="text" data-name="transportAddress" tabindex="0"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-contact" class="highlight">Transport Contact: </label>
                </div>
                <div class="row1">
                    <input name="transportContact" id="transport-contact" type="text" data-name="transportContact" tabindex="0"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-gst" class="highlight">Transport GST: </label>
                </div>
                <div class="row1">
                    <input id="transport-gst" name="transportGST" type="text" data-name="transportGST" tabindex="0"/>
                </div>
            </div>
        </div>
    </template>
    <template id="body-row-options-template">
        <div class="body-row-options">
            <button data-cmd="delete-row" onclick="deleteRow(event)" type="button" tabindex="-1" class="hover left" data-msg="Delete row (Shift+Del)">Delete Row</button>
            <button data-cmd="desc-btn" type="button" tabindex="-1" class="hover left" data-msg="Add description (Shift+Insert)">Add Description</button>
        </div>
    </template>
    <template id="item-group-option-template">
        <div id="item-group-option" class="page">
            <h2>Item grouping options</h2>
            <p>Grouping items will reduce space space requirement in your bill page.</p>
            <div id="body">
                <div>
                    <input type="checkbox" name="allow-grp" id="allow-grp" onchange="revealMoreGrpOpts(event,1)" tabindex="0">
                    <label for="allow-grp">Allow grouping of items</label>
                </div>
                <div id="price-selector-div" class="hide">
                    <p>Select price</p>
                    <div>
                        <select onchange="revealMoreGrpOpts(event,2)" tabindex="0">
                            <option value="none">None</option>
                        </select>
                    </div>
                </div>
                <div id="item-list">
                    <div id="old-grp" class="hide">
                        <p>Previous Group</p>
                        <div id="old-item-host"></div>
                    </div>
                </div>
                <button id="create-grp-btn" class="hide" onclick="createNewGrp(event)" type="button" tabindex="0">Create new group</button>
            </div>
        </div>
    </template>
    <template id="grp-item-template">
        <div class="item">
            <input type="checkbox" tabindex="0">
            <p class="eq-space" data-name="name"></p>
            <p class="eq-space" data-name="qty"></p>
            <p class="eq-space" data-name="sellUnit"></p>
        </div>
    </template>
    <template id="new-grp-label-form-template">
        <form onsubmit="addLabelToGrp(event)">
            <div>
                <div>
                    <input type="text" name="label" autofocus placeholder="Enter label of new group" tabindex="0">
                </div>
                <div>
                    <button type="button" onclick="closeModal()" tabindex="0">Cancel Grouping</button>
                    <button type="submit" tabindex="0">Confirm Grouping</button>
                </div>
            </div>
        </form>
    </template>
    <template id="roll-text-template">
        <div class="horizontal-scroll-list">
            <ul>
                <li>Available shortcuts:</li>
                <li>Ctrl+'+': to add new row</li>
                <li>Shift+Del: to delete selected row</li>
                <li>Enter: Move focus to first input</li>
                <li>Tab: Move focus to next input</li>
                <li>Shift+Tab: Move focus to previous input</li>
                <li>Ctrl+'R': to focus the current row</li>
                <li>ArrowUp: Move focus to previous row</li>
                <li>ArrowDown: Move focus to next row</li>
                <li>Ctrl+Shift+(ArrowUP/ArrowDown): Move row up/down</li>
                <li>Shift+Insert: Add description</li>
                <li>Shift+Enter: Confirm description</li>
                <li>Shift+Backspace: Remove description</li>
            </ul>
        </div>
    </template>
</body>
</html>
