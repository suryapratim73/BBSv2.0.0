<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Page</title>
    <link rel="stylesheet" href="../css/salePage.css">
    <script src="../js/salePage.js" defer></script>
</head>
<body>
    <h1 id="page-header"></h1>
    <form onsubmit="proceedOrFinishHandler(event)">
        <main onchange="selectionHandler(event)"></main>
        <footer></footer>
    </form>
    <template id="page-1-template">
        <div id="page-1" class="page" data-pageno="1">
            <div>
                <div>
                    <label for="name" class="highlight">Name: </label>
                </div>
                <div class="row1">
                    <input required type="text" id="name" spellcheck="false" name="name" autofocus data-name="name" list="customer-names"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="address" class="highlight">Address: </label>
                </div>
                <div class="row1">
                    <input required id="address" type="text" name="address" data-name="address" />
                </div>
            </div>
            <div>
                <div>
                    <label for="phones" class="highlight">Phone:</label>
                </div>
                <div class="row1">
                    <input type="text" list="customer-phones" placeholder="Pattern '+country code'+<SPACE>+10 digit number" pattern="(\+?\d+ ?)*\d{4,5} *\d{4,5}" name="phones" data-name="phones" data-type="Number" id="phones" onkeypress="validateInput(event)" />
                    <button id="add-new-phone" type="button" tabindex="-1" onclick="addPhone(event)">+</button>
                </div>
            </div>
            <div>
                <div>
                    <label for="email" class="highlight">Customer Email</label>
                </div>
                <div class="row1">
                    <input name="email" pattern="\S+@\S+\.\S+" placeholder="Example: xyz@xyz.xyz" type="text" data-name="email" id="email" />
                </div>
            </div>
            <div>
                <div>
                    <label for="gst" class="highlight">GST Number</label>
                </div>
                <div class="row1">
                    <input name="gst" onkeypress="upperCaseInput(event)" pattern="^\d{2}[A-Z]{5}\d{4}[A-Z]{1}\w{1}Z\w{1}$" type="text" data-name="gst" id="gst" />
                </div>
            </div>
        </div>
    </template>
    <template id="page-2-template">
        <div id="page-2" class="page" data-pageno="2">
            <div>
                <div>
                    <label for="billDate" class="highlight">Date: </label>
                </div>
                <div class="row1">
                    <input type="date" id="billDate" required name="billDate" data-name="billDate"/>
                </div>
            </div>
            <div>
                <div>
                    <label for="orderRef" class="highlight">Order Reference:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="orderRef" name="orderRef" id="orderRef" placeholder="optional">
                </div>
            </div>
            <div>
                <div>
                    <label for="ewayBill" class="highlight">E-Way Bill:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="ewayBill" name="ewayBill" id="ewayBill" placeholder="optional">
                </div>
            </div>
            <div>
                <div>
                    <label for="stateNcode" class="highlight">State & Code:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="stateNcode" name="stateNcode" id="stateNcode" placeholder="optional">
                </div>
            </div>
            <div>
                <div>
                    <label for="placeOfSupply" class="highlight">Place Of Supply:</label>
                </div>
                <div class="row1">
                    <input type="text" data-name="placeOfSupply" name="placeOfSupply" id="placeOfSupply" placeholder="optional">
                </div>
            </div>
            <div>
                <div>
                    <label for="billType" class="highlight">Bill Type: </label>
                </div>
                <div class="row1">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-type-regular">Regular: </label>
                            <input type="radio" checked required data-name="billType" name="billType" id="bill-type-regular" value="regular" />
                        </div>
                        <div>
                            <label for="bill-type-monthly">Monthly: </label>
                            <input type="radio" data-name="billType" name="billType" id="bill-type-monthly" value="monthly" />
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="bill-number-regular" class="highlight">Bill Number: </label>
                </div>
                <div class="row1 bill-number regular">
                    <input name="billNo" id="bill-number-regular" required type="text" data-name="billNo" />
                </div>
                <div class="row1 hide bill-number monthly">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-number-reserve">Reserved: </label>
                            <input type="radio" required data-name="billNo" disabled  name="billNo" id="bill-number-reserve" value="reserve" />
                        </div>
                        <div>
                            <label for="bill-number-spot">Spot: </label>
                            <input type="radio" data-name="billNo" name="billNo" disabled id="bill-number-spot" value="spot" />
                        </div>
                        <div>
                            <input type="checkbox" name="autoBill" data-name="autoBill" disabled id="auto-bill">
                            <label for="auto-bill">Auto Bill</label>
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label class="highlight">Bill Status</label>
                </div>
                <div class="row1">
                    <div class="radio-btn-div">
                        <div>
                            <label for="bill-status-open">Open: </label>
                            <input type="radio" required data-name="billStatus"  name="billStatus" id="bill-status-open" value="open" />
                        </div>
                        <div>
                            <label for="bill-status-close">Close: </label>
                            <input type="radio" data-name="billStatus" checked name="billStatus" id="bill-status-close" value="close" />
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-to" class="highlight">Ship to: </label>
                </div>
                <div class="row1">
                    <input type="text" name="shipTo" id="ship-to" data-name="shipTo">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-addr" class="highlight">Shipping address</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipAddr" id="ship-addr" data-name="shipAddr">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-phone" class="highlight">Consignee contact</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipPh" id="ship-phone" data-name="shipPh">
                </div>
            </div>
            <div>
                <div>
                    <label for="ship-gst" class="highlight">Consignee GST</label>
                </div>
                <div class="row1">
                    <input type="text" name="shipGST" id="ship-gst" data-name="shipGST">
                </div>
            </div>
            <div>
                <div>
                    <label for="delivery-mode" class="highlight">Delivery Mode: </label>
                </div>
                <div class="row1">
                    <select name="deliveryType" id="delivery-mode" onchange="assignDeliveryOptions(event)" required type="text" data-name="deliveryType">
                        <option value="hand">Hand</option>
                        <option value="transport">Transport</option>
                    </select>
                </div>
            </div>
            <div id="transport-div" class="retractable-div-container hide">
                <div onclick="execRetractHandler(event)">
                    <button tabindex="-1" type="button" class="hide">Show</button>
                    <button tabindex="-1" type="button">Hide</button>
                </div>
            </div>
        </div>
    </template>
    <template id="page-3-template">
        <div id="page-3" class="page" data-pageno="3">
            <div id="table">
                <div class="row head">
                    <div class="col sm"><p>Sl No.</p></div>
                    <div class="col lg"><p>Particular</p></div>
                    <div class="col md"><p>HSN No</p></div>
                    <div class="col md"><p>Quantity</p></div>
                    <div class="col md"><p>Unit</p></div>
                    <div class="col md"><p>Rate</p></div>
                    <div class="col md"><p>Amount</p></div>
                    <div class="col sm"><p>CGST</p></div>
                    <div class="col sm"><p>SGST</p></div>
                    <div class="col sm"><p>IGST</p></div>
                    <div class="col md"><p>Total</p></div>
                </div>
                <div id="tbody" onmouseover="textRollAnnimation(event)" class="hide-scrollbar" oninput="calculateAmounts(event)" onchange="selectionHandler(event)">
                    <div class="row row-control-div" id="add-item">
                        <button type="button" class="main-ui-btn" onclick="addRow(event)">+</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="page-4-template">
        <div id="page-4" class="page" data-pageno="4">
            <div id="left-section">
                <div id="payment-div" oninput="updateBillValue(event)" onkeypress="validateInput2(event)">
                    <div id="payment-mode">
                        <label for="payment-mode">Select payment mode:</label>
                        <select id="payment-mode" onchange="showPaymentMode(event)">
                            <option value="due" selected>Due</option>
                            <option value="cash">Cash</option>
                            <option value="check">Check</option>
                            <option value="online">NEFT</option>
                        </select>
                    </div>
                    <div id="cash-payment" class="hide payment-detail">
                        <div>
                            <p>Enter amount</p>
                            <input data-type="Number" value="0" data-subtype="price" data-name="payment" />
                        </div>
                    </div>
                    <div id="check-payment" class="hide payment-detail">
                        <div>
                            <p>Bank Name</p>
                            <input type="text" data-name="bankName"/>
                        </div>
                        <div>
                            <p>Bank Branch</p>
                            <input type="text" data-name="bankBranch"/>
                        </div>
                        <div>
                            <p>Account No.</p>
                            <input type="text" data-subtype="price" data-name="bankACNo" data-type="Number" onkeypress="validateInput(event)"/>
                        </div>
                        <div>
                            <p>Check No.</p>
                            <input type="text" data-subtype="price" data-name="chkNo" data-type="Number" onkeypress="validateInput(event)"/>
                        </div>
                        <div>
                            <p>Amount paid</p>
                            <input type="text" value="0" data-name="payment" data-subtype="price" data-type="Number" onkeypress="validateInput(event)"/>
                        </div>
                        <div>
                            <p>Mark as paid</p>
                            <select type="text" data-name="paymentStatus" onchange="updatePayStatus(event)">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                    </div>
                    <div id="online-payment" class="hide payment-detail">
                        <div>
                            <p>Bank Name</p>
                            <input type="text" data-name="bankName" />
                        </div>
                        <div>
                            <p>Transaction Ref.</p>
                            <input type="text" data-name="bankTrnRef" />
                        </div>
                        <div>
                            <p>Amount paid</p>
                            <input type="text" value="0" data-name="payment" data-subtype="price" data-type="Number" onkeypress="validateInput(event)"/>
                        </div>
                        <div>
                            <p>Mark as paid</p>
                            <select type="text" data-name="paymentStatus" onchange="updatePayStatus(event)">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="discount-div">
                    <input type="text" oninput="applyDiscount(event)" placeholder="Type discount if any in %" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)">
                </div>
                <div id="grp-btn-div">
                    <button data-cmd="grp-item" disabled onclick="showItemMergeOpts()" type="button">Show Item Grouping Options</button>
                </div>
            </div>
            <div id="summary-div">
                <div>
                    <p>Bill Amount</p>
                    <p data-name="netAmtTax" class="highlight">0</p>
                </div>
                <div>
                    <p>Delivery Charge</p>
                    <p data-name="delCharge" class="highlight">0</p>
                </div>
                <div id="netAmtTaxDel-div">
                    <p>Net Amount</p>
                    <p data-name="netAmtTaxDel" class="highlight">0</p>
                </div>
                <div>
                    <p>Net Payment</p>
                    <p data-name="paymentAmt" class="highlight">0</p>
                </div>
                <div>
                    <p>Net Due</p>
                    <p data-name="dueAmt" class="highlight">0</p>
                </div>
                <div>
                    <p>Net Return</p>
                    <p data-name="return" class="highlight">0</p>
                </div>
            </div>
        </div>
    </template>
    <template id="footer-template">
        <div id="btn-container">
            <button type="button" data-type="cancel" onclick="cancelAction()" class="hide">Cancel</button>
            <button type="button" data-type="back" onclick="proceedOrFinishHandler(event)" class="hide">Back</button>
            <button type="submit" data-type="proceed" class="main-ui-btn hide">Proceed</button>
            <button type="button" data-type="grp-pg-btn" onclick="showPage4(event,'cancel-grp')" class="main-ui-btn hide">Cancel Grouping</button>
            <button type="button" data-type="grp-pg-btn" onclick="showPage4(event,'cnf-grp')" class="main-ui-btn hide">Done</button>
            <button type="button" data-type="print" class="main-ui-btn hide" onclick="showPrintDialog()">Print</button>
            <button type="button" data-type="save" class="main-ui-btn hide" onclick="saveExit(event)">Save & Exit</button>
        </div>
    </template>
    <template id="body-row-template">
        <div class="body row">
            <div class="col sm"><p>1</p></div>
            <div class="col lg"><input type="text" data-name="name" list="stock-names" /></div>
            <div class="col md"><input data-name="hsn" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>
            <div class="col md"><input data-name="qty" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>
            <div class="col md"><input data-name="unit" type="text" list="unit-dl" /></div>                            
            <div class="col md"><input data-name="standardSellPrice" list="rate-list" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>                            
            <div class="col md"><p class="amt"></p></div>
            <div class="col sm"><input data-name="cgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>                            
            <div class="col sm"><input data-name="sgst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>                            
            <div class="col sm"><input data-name="igst" type="text" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" /></div>                            
            <div class="col md"><p class="amt-with-tax"></p></div>
            <div class="desc-div hide">
                <input type="text" data-name="desc" placeholder="Add product description">
                <div onclick="addDescToItem(event)">
                    <button data-cmd="cnf" class="desc-cnf-btn">&#10004;</button>
                    <button data-cmd="rej" class="desc-rej-btn">&#10060;</button>
                </div>
            </div>
        </div>
    </template>
    <template id="summary-div-template">
        <div id="page3-summary-div">
            <div id="product-summary">
                <div class="summary-col">
                    <div>
                        <p>Product:</p>
                        <p class="blue" data-name="name"></p>
                    </div>
                    <div>
                        <p>Available Qty:</p>
                        <p class="blue" data-name="quantity"></p>
                    </div>
                    <div>
                        <p>Buy Price:</p>
                        <p class="blue" data-name="buyPrice"></p>
                    </div>
                </div>
                <div class="summary-col">
                    <div>
                        <p>Last Sell Price:</p>
                        <p class="blue" data-name="lastSellPrice">0</p>
                    </div>
                    <div>
                        <p>Standard Sell Price:</p>
                        <p class="blue" data-name="standardSellPrice">0</p>
                    </div>
                    <div>
                        <p>Special Sell Price:</p>
                        <p class="blue" data-name="specialPrice">0</p>
                    </div>
                </div>
            </div>
            <div id="bill-summary">
                <div>
                    <p>Sold Qty:</p>
                    <p class="highlight" data-name="netQty">0</p>
                </div>
                <div>
                    <p>Amt:</p>
                    <p class="highlight" data-name="netAmt">0</p>
                </div>
                <div>
                    <p>Amt with Tax:</p>
                    <p class="highlight" data-name="netAmtTax">0</p>
                </div>
            </div>
        </div>
    </template>
    <template id="transport-retractable-div-template">
        <div class="retractable-div" data-collapsed="false">
            <div>
                <div>
                    <label for="transport-name" class="highlight">Transport Name: </label>
                </div>
                <div class="row1">
                    <input id="transport-name" list="transport-dl" name="transportName" placeholder="compulsory feild" required type="text" data-name="transportName" />
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-address" class="highlight">Transport Address: </label>
                </div>
                <div class="row1">
                    <input id="transport-address" name="transportAddress" type="text" data-name="transportAddress" />
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-contact" class="highlight">Transport Contact: </label>
                </div>
                <div class="row1">
                    <input name="transportContact" id="transport-contact" type="text" data-name="transportContact" />
                </div>
            </div>
            <div>
                <div>
                    <label for="transport-gst" class="highlight">Transport GST: </label>
                </div>
                <div class="row1">
                    <input id="transport-gst" name="transportGST" type="text" data-name="transportGST" />
                </div>
            </div>
        </div>
    </template>
    <template id="body-row-options-template">
        <div class="body-row-options">
            <button data-cmd="delete-row" onclick="deleteRow(event)" type="button" tabindex="-1">Delete Row</button>
            <button data-cmd="desc-btn" type="button" tabindex="-1">Add Description</button>
        </div>
    </template>
    <template id="item-group-option-template">
        <div id="item-group-option" class="page">
            <h2>Item grouping options</h2>
            <p>Grouping items will reduce space space requirement in your bill page.</p>
            <div id="body">
                <div>
                    <input type="checkbox" name="allow-grp" id="allow-grp" onchange="revealMoreGrpOpts(event,1)">
                    <label for="allow-grp">Allow grouping of items</label>
                </div>
                <div id="price-selector-div" class="hide">
                    <p>Select price</p>
                    <div>
                        <select onchange="revealMoreGrpOpts(event,2)">
                            <option value="none">None</option>
                        </select>
                    </div>
                </div>
                <div id="item-list">
                    <div id="old-grp" class="hide">
                        <p>Previous Group</p>
                        <div id="old-item-host"></div>
                    </div>
                </div>
                <button id="create-grp-btn" class="hide" onclick="createNewGrp(event)" type="button">Create new group</button>
            </div>
        </div>
    </template>
    <template id="grp-item-template">
        <div class="item">
            <input type="checkbox">
            <p class="eq-space" data-name="name"></p>
            <p class="eq-space" data-name="qty"></p>
            <p class="eq-space" data-name="sellUnit"></p>
        </div>
    </template>
    <template id="new-grp-label-form-template">
        <form onsubmit="addLabelToGrp(event)">
            <div>
                <div>
                    <input type="text" name="label" autofocus placeholder="Enter label of new group">
                </div>
                <div>
                    <button type="button" onclick="closeModal()">Cancel Grouping</button>
                    <button type="submit">Confirm Grouping</button>
                </div>
            </div>
        </form>
    </template>
</body>
</html>
