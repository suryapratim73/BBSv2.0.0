<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases</title>
    <link rel="stylesheet" href="../css/stockDisplay.css">
    <script src="../js/stockDisplay.js" defer></script>
</head>
<body>
    <nav role="navigation" aria-label="Inventory viewer navigation">
        <h1>Inventory viewer</h1>
        <div id="searchbar-container" data-ui="stock-search" role="search">
            <input type="text" spellcheck="false" oninput="searchHandler(event);fuzzySearchHandler(event)" placeholder="Type to search through stock.." aria-label="Search stock inventory" tabindex="0" data-usefuzzysearch="true" data-tablename="stock" list="stock-names">
        </div>
    </nav>
    <main role="main">
        <div id="table" data-ui="stock-table" role="table" aria-label="Stock inventory table">
            <div class="row head" role="row">
                <div class="col eq-space" role="columnheader"><p>Sl. No</p></div>
                <div class="col eq-space" role="columnheader"><p>Stock Name</p></div>
                <div class="col eq-space"><p>Type</p></div>
                <div class="col eq-space"><p>Quantity</p></div>
                <div class="col eq-space"><p>Buy Price</p></div>
            </div>
            <div id="tbody" class="hide-scrollbar" role="rowgroup">
            </div>
        </div>
    </main>
    <datalist id="stock-names"></datalist>
    <template id="body-row-template">
        <div class="body row">
            <p class="col eq-space" data-colName="slNo"></p>
            <p class="col eq-space" data-colName="name"></p>
            <p class="col eq-space" data-colName="type"></p>
            <p class="col eq-space" data-colName="quantity"></p>
            <p class="col eq-space" data-colName="buyPrice"></p>
        </div>
    </template>
    <template id="pHistory-modal-template">
        <div class="page1-elem">
            <div>
                <canvas class="pHistory-graph" aria-label="Purchase history graph for this stock item"></canvas>
            </div>
            <div class="table">
                <div class="row head">
                    <p class="col eq-space">Customer Name</p>
                    <p class="col eq-space">Sell Date</p>
                </div>
                <div class="tbody hide-scrollbar"></div>
            </div>
            <div>
                <button onclick="closeModal()" tabindex="0">Close</button>
                <button class="main-ui-btn" onclick="showUpdater()" tabindex="0">Update Stock</button>
            </div>
        </div>
    </template>
    <template id="data-modal-template">
        <div class="data-modal">
            <p></p>
        </div>
    </template>
    <template id="stock-updater-template">
        <div class="page2-elem">
            <div id="feild-container" onmouseover="showDeleteBTN(event)"></div>
            <div>
                <button onclick="updateStock()" class="main-ui-btn" tabindex="0">Update</button>
                <button onclick="backToPage1()" tabindex="0">Cancel</button>
                <button onclick="showAddNewFeild()" data-msg="Add New Feild" class="hover right top" tabindex="0">+</button>
            </div>
        </div>
    </template>
    <template id="add-new-feild-template">
        <div class="page3-elem">
            <div id="feild-container">
                <h2>Add New Feild</h2>
                <div>
                    <p>Feild Name</p>
                    <div><input type="text" data-colName="feild" tabindex="0"></div>
                </div>
                <div>
                    <p>Feild Value</p>
                    <div><input type="text" data-colName="value" tabindex="0"></div>
                </div>
            </div>
            <div>
                <button class="main-ui-btn" onclick="appendNewInfo()" tabindex="0">Add</button>
                <button onclick="backToPage2()" tabindex="0">Cancel</button>
            </div>
        </div>
    </template>
    <template id="new-row-template">
        <div class="new-row">
            <p data-colName="feild"></p>
            <div><input type="text" data-colName="value" tabindex="0"></div>
        </div>
    </template>
</body>
</html>
