<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchases</title>
    <link rel="stylesheet" href="../css/stockDisplay.css">
    <script src="../js/stockDisplay.js" defer></script>
</head>
<body>
    <nav>
        <h1>Inventory viewer</h1>
        <div id="searchbar-container">
            <input type="text" spellcheck="false" oninput="searchHandler(event)" placeholder="Type to search through stock..">
        </div>
    </nav>
    <main>
        <div id="table">
            <div class="row head">
                <div class="col eq-space"><p>Sl. No</p></div>
                <div class="col eq-space"><p>Stock Name</p></div>
                <div class="col eq-space"><p>Type</p></div>
                <div class="col eq-space"><p>Quantity</p></div>
                <div class="col eq-space"><p>Buy Price</p></div>
            </div>
            <div id="tbody" class="hide-scrollbar">
            </div>
        </div>
    </main>
    <template id="body-row-template">
        <div class="body row">
            <p class="col eq-space" data-colName="slNo"></p>
            <p class="col eq-space" data-colName="name"></p>
            <p class="col eq-space" data-colName="type"></p>
            <p class="col eq-space" data-colName="quantity"></p>
            <p class="col eq-space" data-colName="buyPrice"></p>
        </div>
    </template>
    <template id="pHistory-modal-template">
        <div>
            <canvas class="pHistory-graph"></canvas>
        </div>
        <div class="table">
            <div class="row head">
                <p class="col eq-space">Customer Name</p>
                <p class="col eq-space">Sell Date</p>
            </div>
            <div class="tbody hide-scrollbar"></div>
        </div>
        <div>
            <button onclick="closeModal()">Close</button>
        </div>
    </template>
    <template id="data-modal-template">
        <div class="data-modal">
            <p></p>
        </div>
    </template>
</body>
</html>
