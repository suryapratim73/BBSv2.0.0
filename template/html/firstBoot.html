<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Bigbyte Business Solution</title>
    <link rel="stylesheet" href="../css/firstBoot.css">
    <script src="../js/firstBoot.js" defer></script>
</head>
<body>
    <div>
        <h1>Welcome to BBS</h1>
        <p>Please fill out your basic company details while we prepare BBS for first launch.</p>
    </div>
    <form onsubmit="submitHandler(event)" onclick="submitHandler(event)" data-cmd="page-1">
        <div id="mode-host"></div>
    </form>
    <template id="page-1-template">
        <div id="page-1" class="page">
            <h2>Fill out your basic company details</h2>
            <p>*Please note if GST number is provided then it cannot be changed later.</p>
            <div>
                <div>
                    <label for="biller">Name *</label>
                </div>
                <div>
                    <input required type="text" spellcheck="false" name="biller" id="biller" autofocus tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="address">Address *</label>
                </div>
                <div>
                    <input required type="text" spellcheck="false" name="address" id="address" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="gst">GST</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="gst" id="gst" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="email">Email</label>
                </div>
                <div>
                    <input type="email" name="email" id="email" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="phones">Contact Number *</label>
                </div>
                <div>
                    <input required type="tel" name="phones" id="phones" pattern="^(\+?\d{0,3}[- ]?)?\d{5} *\d{5}$" name="customer-phones" data-name="phones" data-type="Number" onkeypress="validateInput(event)" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="website">Website</label>
                </div>
                <div>
                    <input type="url" name="website" id="website" tabindex="0">
                </div>
            </div>
            <div>
                <button type="submit" onclick="event.stopPropagation();" data-msg="Continue to next step" class="hover bottom" tabindex="0">Continue</button>
                <button type="button" data-cmd="skip" data-msg="Skip this step" class="hover bottom" tabindex="0">Skip</button>
            </div>
        </div>
    </template>
    <template id="page-2-template">
        <div id="page-2" class="page">
            <h2>Fill out your company's last financial year records</h2>
            <p>*You may skip now and this informations can be filled later</p>
            <div>
                <div>
                    <label for="financialYearStartDate">Financial year start month</label>
                </div>
                <div>
                    <select name="financialYearStartDate:" autofocus required id="financialYearStartDate" tabindex="0">
                        <option value="1/1">January</option>
                        <option value="1/4">April</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="resetBillNo">Reset Bill number at the begining of each financial year?</label>
                </div>
                <div>
                    <select name="resetBillNo" required id="resetBillNo" tabindex="0">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="closingStock">Last year closing stock</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="closingStock" id="closingStock" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="grossCredit">Net Gross Credit</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="grossCredit" id="grossCredit" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="grossDebt">Net Gross Debt</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="grossDebt" id="grossDebt" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="advNetIncome">Net Advance Income</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="advNetIncome" id="advNetIncome" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="advNetExpence">Net Advance Expence</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="advNetExpence" id="advNetExpence" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <button type="submit" onclick="event.stopPropagation()" data-msg="Continue to next step" class="hover bottom" tabindex="0">Continue</button>
                <button type="button" data-cmd="page-1" data-msg="Go back to previous page" class="hover bottom" tabindex="0">Back</button>
                <button type="button" data-cmd="skip" data-msg="Skip this step" class="hover bottom" tabindex="0">Skip</button>
            </div>
        </div>
    </template>
    <template id="page-3-template">
        <div id="page-3" class="page">
            <h2>Create user</h2>
            <div id="page-3-host">
                <p>Create a regular users with different in-app priviledges. You can create/update users later from app settings.</p>
                <button data-cmd="create-user" autofocus type="button" data-msg="Create a new user account" class="hover bottom" tabindex="0">Create user</button>
            </div>
            <div>
                <button type="submit" onclick="event.stopPropagation()" data-msg="Continue to next step" class="hover bottom" tabindex="0">Continue</button>
                <button type="button" data-cmd="page-2" data-msg="Go back to previous page" class="hover bottom" tabindex="0">Back</button>
                <button type="button" data-cmd="skip" data-msg="Skip this step" class="hover bottom" tabindex="0">Skip</button>
            </div>
        </div>
    </template>
    <template id="page-4-template">
        <div id="page-4" class="page">
            <h2>Personalize BBS</h2>
            <p>A little touch of pPersonalization. Don't worry everything can be changed later.'</p>
            <div>
                <div>
                    <label for="filePath">Choose lockscreen wallpaper</label>
                </div>
                <div>
                    <input type="text" spellcheck="false" name="filePath" placeholder="Using default wallpaper on lockscreen " id="file-path" tabindex="0">
                    <button type="button" class="main-ui-btn hover right" onclick="chooseFile(event)" data-msg="Choose lockscreen wallpaper" tabindex="0">Choose</button>
                </div>
            </div>
            <div>
                <div>
                    <label for="theme-pref">Theme preference</label>
                </div>
                <div>
                    <select name="theme-pref" id="theme-pref" tabindex="0">
                        <option value="false">Light</option>
                        <option value="true">Dark</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="submit" onclick="event.stopPropagation()" data-msg="Finish setup" class="hover bottom" tabindex="0">Continue</button>
                <button type="button" data-cmd="page-3" data-msg="Go back to previous page" class="hover bottom" tabindex="0">Back</button>
                <button type="button" data-cmd="skip" data-msg="Skip this step" class="hover bottom" tabindex="0">Skip</button>
            </div>
        </div>
    </template>
    <template id="create-user-template">
        <div id="create-user-form">
            <div>
                <divv>
                    <label for="name">Select user</label>
                </divv>
                <divv>
                    <input type="text" spellcheck="false" autofocus name="name" tabindex="0">
                </divv>
            </div>
            <div>
                <div>
                    <label for="passwd">Set password</label>
                </div>
                <div>
                    <input type="password" name="passwd" id="passwd" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="re-passwd">Re-enter password</label>
                </div>
                <div>
                    <input type="password" name="re-passwd" id="re-passwd" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="role">Role</label>
                </div>
                <div>
                    <select name="role" id="role" tabindex="0">
                        <option value="all" selected>All</option>
                        <option value="bill">Billing</option>
                        <option value="purchase">Purchase</option>
                    </select>
                </div>
            </div>
            <div>
                <button type="button" data-cmd="add-user" data-msg="Add new user" class="hover bottom" tabindex="0">Add</button>
                <button type="button" data-cmd="cancel-user-add" data-msg="Cancel user creation" class="hover bottom" tabindex="0">Cancel</button>
            </div>
        </div>
    </template>
</body>
</html>
