<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/mainPage.js" defer></script>
    <link rel="stylesheet" href="../../images/fontawesome-free-6.1.1-web/css/all.min.css">
    <link rel="stylesheet" href="../css/mainPage.css">
    <link rel="stylesheet" href="../css/themes.css">
</head>
<body>
    <div id="app-banner" data-ui="app-banner"></div>
    <div id="nav-div" data-ui="nav-sidebar" onclick="modeSwitcher(event)" role="navigation" aria-label="Main navigation">
        <div data-ui="logo-container">
            <h1 data-ui="app-logo">BBS</h1>
        </div>
        <div role="menu" data-ui="nav-menu-primary">
            <p data-cmd="overview" data-ui="nav-overview" role="menuitem">Overview</p>
            <p data-cmd="sale" data-ui="nav-sale" role="menuitem">Sale</p>
            <p data-cmd="purchase" data-ui="nav-purchase" role="menuitem">Purchase</p>
        </div>
        <div role="menu" data-ui="nav-menu-secondary">
            <p data-cmd="settings" data-ui="nav-settings">Settings</p>
            <!-- <p data-cmd="help">Help</p> -->
            <p data-cmd="logout" data-ui="nav-logout">Logout</p>
            <p data-cmd="lock" data-ui="nav-lock">Lock</p>
            <p id="reset-weather-btn" data-cmd="reset-weather" data-msg="Revert to default theme" class="hover top">Weather Theme</p>
            <p id="kiosk-status-btn" data-cmd="kiosk-status" data-msg="Kiosk server status" class="hover top">Kiosk: Off</p>
        </div>
    </div>
    <div id="main-div" data-ui="main-content" role="main">
        <div>
            <h1 id="gretings-header" data-ui="greeting-header"></h1>
            <div>
                <div>
                    <h2>Overview</h2>
                    <div id="sale-purchase-btn-div">
                        <div>
                            <button onclick="ipcRenderer.send('open-bills-folder')" data-msg="Open bills folder" class="hover bottom" tabindex="0">Bills </button>
                            <button onclick="ipcRenderer.send('new-sale-purchase',1)" data-msg="Create a new sale" class="hover bottom">Create Sale</button>
                            <button class="fa-sharp fa-solid fa-caret-down drop-down-btn" onclick="document.querySelector('.drop-down').classList.toggle('hide');" aria-label="Show more sale options" aria-expanded="false" aria-controls="sale-dropdown"></button>
                            <div>
                                <div class="drop-down hide" id="sale-dropdown" role="menu">
                                    <div>
                                        <a href="#" onclick="ipcRenderer.send('new-sale-purchase',3)">Start Kiosk Server</a>
                                    </div>
                                    <div>
                                        <a href="#" onclick="ipcRenderer.send('new-sale-purchase',4)">Update order</a>
                                    </div>
                                    <div>
                                        <a href="#">Update "Open" bills</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button onclick="ipcRenderer.send('new-sale-purchase',2)" data-msg="Register a new purchase" class="hover bottom" tabindex="0">Register Purchase</button>
                    </div>
                </div>
                <div id="mode-host" oncontextmenu="showContextMenu(event)">
                    <!-- work in progress -->
                </div>
            </div>
        </div>
        <div id="right-div">
            <div id="knob" data-ui="notification-knob" onclick="expandOrCollapsePanel()" aria-label="Toggle notification panel"></div>
            <div id="panel" data-ui="notification-panel" class="collapse-panel" data-collapsed="true" role="region" aria-label="Notifications panel">
                <div>
                    <h2>Notifications</h2>
                </div>
                <div id="notification-div" data-ui="notification-list" class="hide-scrollbar" onclick="notificationAction(event)"></div>
                <div class="btn-div">
                    <button data-cmd="clear" data-msg="Clear all notifications" class="hover left" tabindex="0">Clear</button>
                </div>
            </div>
        </div>
    </div>
    <template id="overview-page-template">
        <div id="overview-div" class="mode-content">
            <div ondblclick="dblClickHandler(event)">
                <div class="table hide" id="order-table-div" role="table" aria-label="Unbilled orders overview table">
                    <h3>Unbilled orders</h3>
                    <div class="row head">
                        <div class="col eq-space"><p data-col="slNo">Sl No</p></div>
                        <div class="col eq-space"><p data-col="billDate">Date</p></div>                        
                        <div class="col eq-space"><p data-col="name">Customer Name</p></div>
                        <div class="col eq-space"><p data-col="netAmtTax">Amount</p></div>
                        <div class="col eq-space"><p data-col="paymentStatus">Payment Status</p></div>
                        <div class="col eq-space"><p data-col="status">Order Status</p></div>
                    </div>
                    <div class="tbody hide-scrollbar"></div>
                </div>
                <div class="table" id="expired-bill-table-div">
                    <div>
                        <h3>Expired Bills</h3>
                        <select name="finYear" id="fin-year" onchange="overviewPageInit()" tabindex="0">
                            <option value="0" selected>Current Financial Year</option>
                            <option value="1">Last Financial Year</option>
                            <option value="2">All Financial Year</option>
                        </select>
                    </div>
                    <div class="row head">
                        <div class="col eq-space"><p data-col="billNo">Bill Number</p></div>
                        <div class="col eq-space"><p data-col="billDate">Bill Date</p></div>
                        <div class="col eq-space"><p data-col="name">Customer Name</p></div>
                        <div class="col eq-space"><p data-col="billAmt">Bill Amount</p></div>
                    </div>
                    <div class="tbody hide-scrollbar"></div>
                </div>
            </div>
            <div>
                <div>
                    <div id="stock-div" class="table">
                        <h3>Stocks running low</h3>
                        <div class="row head">
                            <div class="col eq-space"><p data-col="name">Name</p></div>
                            <div class="col eq-space"><p data-col="quantity">Quantity</p></div>
                        </div>
                        <div class="tbody hide-scrollbar">
                        </div>
                    </div>
                </div>
                <div id="scheduler-div" data-ui="scheduler" onclick="openScheduleManager(event)" onmouseenter="clearInterval(caroselTimer)" onmouseleave="carosel([...document.querySelectorAll('.event-page')],0)">
                    <div class="event-page first-page">
                        <div class="event-div">
                            <div id="dt-div">
                                <h1></h1>
                                <p></p>
                            </div>
                        </div>
                        <div class="btn-container">
                            <button data-cmd="call-scheduler" data-msg="Add New Event" class="hover right top" tabindex="0">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="quick-host-template">
        <div id="quick-host">
            <div>
                <button onclick="backAction(event)" class="main-ui-btn" data-msg="Go back" class="hover top" tabindex="0">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </button>
            </div>
            <div id="host"></div>
        </div>
    </template>
    <template id="bill-display-template">
        <div class="mode-content">
            <div>
                <div class="table">
                    <div class="row head">
                        <div class="col eq-space"><p>Sl. No.</p></div>
                        <div class="col eq-space"><p>Particular</p></div>
                        <div class="col eq-space"><p>Quantity</p></div>
                        <div class="col eq-space"><p>Rate</p></div>
                    </div>
                    <div class="tbody hide-scrollbar">
                    </div>
                </div>
            </div>
            <div>
                <div id="bil-meta" class="side-divs"></div>
                <div id="customer-meta" class="side-divs"></div>
            </div>
        </div>
    </template>
    <template id="sale-page-template">
        <div class="mode-content" id="sale-div">
            <div id="sale-div-content" onmouseenter="saleOverviewContext()" onmouseleave='document.getElementById("overview-context").classList.add("hide");document.getElementById("context-options").classList.add("hide")'>
                <div id="overview-context" class="hide">
                    <div class="icon-container" onclick="showContextOptions()">
                        <i data-msg="Change widget" class="hover">&#8635;</i>
                    </div>
                    <div class="hide" id="context-options" onclick="updateSaleOverviewPreference(event)">
                        <p data-name="monthly1x">Monthly Sale - Current Month</p>
                        <p data-name="monthly3x">Monthly Sale - Last 3 Months</p>
                    </div>
                </div>
            </div>
            <div>
                <div id="sale-graph-div">
                    <div>
                        <h3>Sale chart</h3>
                        <canvas id="sale-graph"></canvas>
                    </div>
                    <div>
                        <label>Change chart period</label>
                        <select onchange="updateChart(event,'#sale-graph')" tabindex="0">
                            <option value="year" data-mode="3">Year</option>
                            <option value="month" data-mode="2">Month</option>
                            <option value="day" data-mode="1" selected>Day</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="sale-table-template">
        <div id="sale-table" class="widget">
            <div class="table">
                <div class="row head">
                    <p class="col eq-space" data-col="billDate">Date</p>
                    <p class="col eq-space" data-col="name">Name</p>
                    <p class="col eq-space" data-col="netAmt">Bill Amount</p>
                    <p class="col eq-space" data-col="paymentStatus">Paid / Unpaid</p>
                </div>
                <div class="tbody hide-scrollbar"></div>
            </div>
        </div>
    </template>
    <template id="purchase-page-template">
        <div id="purchase-div" class="mode-content">
            <div id="current-purchase">
                <div class="table">
                    <h3>Today's purchases'</h3>
                    <div class="row head">
                        <div class="col eq-space"><p>Bill Number</p></div>
                        <div class="col eq-space"><p>Bill Date</p></div>
                        <div class="col eq-space"><p>Supplier Name</p></div>
                        <div class="col eq-space"><p>Bill Amount</p></div>
                    </div>
                    <div class="tbody hide-scrollbar">
                    </div>
                </div>
            </div>
            <div>
                <div id="purchase-graph-div">
                    <div>
                        <h3>Purchase Chart</h3>
                        <canvas id="purchase-graph"></canvas>
                    </div>
                    <div><label>Change chart period</label>
                        <select onchange="updateChart(event,'#purchase-graph')" tabindex="0">
                            <option value="year" data-mode="3">Year</option>
                            <option value="month" data-mode="2">Month</option>
                            <option value="day" data-mode="1" selected>Day</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="settings-page-template">
        <div id="settings-div" class="mode-content">
            <nav onclick="switchSettingsNav(event)">
                <p data-mode="app-settings" class="selected">App</p>
                <p data-mode="billing-settings">Company & Billing</p>
            </nav>
            <main id="main">
                <h1>Settings</h1>
                <div id="settings-container" onclick="showForm(event)">
                    <div class="settings" data-mode="app-settings" id="app-settings">
                        <h2>App Settings</h2>
                        <div class="settings-div">
                            <p class="bill purchase" data-cmd="general" data-show="app-settings" data-msg="Define settings like default app values, ">General App Setting</p>
                            <p data-cmd="set-2-factor-auth" data-show="app-settings" data-msg="Unlock using password and any authenticator app.">Set 2 factor authentication</p>
                            <!-- <p class="bill purchase hide" data-show="app-settings" data-cmd="enable-disable-sms-notification" data-msg="SMS notification helps you to notify customer about their due payment but will cost you some money per month based on your usage.">SMS Notification</p> -->
                            <p class="bill purchase" data-show="app-settings" data-cmd="lock-screen" data-msg="Change lock screen background.">Lock screen</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="add-user" data-msg="Add users of this software and assign role to them.">Add user</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="update-user" data-msg="Update user privilege and password.">Update user</p>
                            <p data-cmd="session-management" data-show="app-settings" data-msg="Configure lock behaviour and session persistence.">Session management</p>
                            <p data-cmd="appearance-management" data-show="app-settings" data-msg="Configure app appearance and theming of BBS..">Appearance management</p>
                            <!-- <p data-cmd="network-management" data-show="app-settings" data-msg="Configure nodes in your network.">Network management</p> -->
                            <p class="bill purchase" data-cmd="backup-manager" data-show="app-settings" data-msg="Local or cloud based backup settings.">Backup manager</p>
                            <!-- <p class="bill purchase" data-cmd="registration" data-show="app-settings" data-msg="App registration.">App registration</p> -->
                        </div>
                    </div>
                    <div class="settings hide" data-mode="company-settings" id="company-settings">
                        <h2>Company settings</h2>
                        <div class="settings-div">
                            <p></p>
                        </div>
                    </div>
                    <div class="settings hide" data-mode="billing-settings" id="billing-settings">
                        <h2>Bill settings</h2>
                        <div class="settings-div">
                            <p data-cmd="company-profile" data-show="billing-settings" data-msg="Edit company profile.">Company profile</p>
                            <p data-cmd="bill-template" data-show="billing-settings" data-msg="Setting related to Bill PDF customization.">Bill template</p>
                            <p data-cmd="bill-no" data-show="billing-settings" data-msg="Define bill number format and set bill no">Invoice numbering</p>
                            <p data-cmd="gst-setting" data-show="billing-settings" data-msg="Define filing GST Intervals,financial year and other relevant Informations">GST Settings</p>
                            <p data-cmd="company-setting" data-show="billing-settings" data-msg="Define company policies and holidays">Company Settings</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </template>
    <template id="set-2-factor-auth-template">
        <form onsubmit="saveSettings(event)" id="set-2-factor-auth-form" data-cmd="set-2-factor-auth" data-show="app-settings">
            <div>
                <div>
                    <div>
                        <button class="main-ui-btn hover bottom" type="button" data-cmd="enable-2-factor" id="enable-2-factor" disabled data-msg="Enable two-factor authentication for added security" tabindex="0">Enable 2-Factor Authentication</button>
                    </div>
                </div>
                <div>
                    <div>
                        <button type="submit" class="main-ui-btn hover bottom" id="done-btn" disabled data-msg="Save 2FA settings" tabindex="0">Done</button>
                        <button type="button" data-cmd="back" data-show="app-settings" data-msg="Cancel and go back" class="hover bottom" tabindex="0">Cancel</button>
                        <button type="button" id="disable-2-factor" disabled data-cmd="disable-2-factor" data-show="app-settings" data-msg="Disable two-factor authentication" class="hover bottom" tabindex="0">Disable 2-Factor Authentication</button>
                    </div>
                </div>
            </div>
            <div>
                <div id="qrcode-div">
                    <img>
                </div>
            </div>
        </form>
    </template>
    <template id="lock-screen-template">
        <form onsubmit="saveSettings(event)" onchange="changeHandler(event)" id="lock-screen" data-cmd="lock-screen" data-show="app-settings">
            <div>
                <div><label for="file-path">Choose a image file</label></div>
                <div>
                    <input type="text" name="filePath" id="file-path" tabindex="0">
                    <button type="button" class="main-ui-btn hover right" onclick="chooseFile(event)" data-msg="Select lock screen image" tabindex="0">Choose</button>
                </div>
            </div>
            <div>
                <div><label for="usePasswd">Use password</label></div>
                <div>
                    <select name="usePasswd" id="usePasswd" tabindex="0">
                        <option value="true">Yes</option>
                        <option value="false" selected>No</option>
                    </select>
                </div>
            </div>
            <div>
                <div><label for="lockOnIdle">Lock on idle</label></div>
                <div>
                    <select name="lockOnIdle" id="lockOnIdle" data-target="idleTime" tabindex="0">
                        <option value="true">Yes</option>
                        <option value="false" selected>No</option>
                    </select>
                </div>
            </div>
            <div>
                <div><label for="idleTime">Idle trigger time</label></div>
                <div>
                    <input type="text" name="idleTime" id="idleTime" placeholder="Time in minutes" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                </div>
            </div>
            <div>
                <button class="main-ui-btn hover bottom" type="submit" data-msg="Save lock screen settings" tabindex="0">Save</button>
                <button type="button" data-cmd="back" data-show="app-settings" data-msg="Cancel and go back" class="hover bottom" tabindex="0">Cancel</button>
            </div>
        </form>
    </template>
    <template id="add-user-template">
        <form onsubmit="saveSettings(event)" id="add-user" data-cmd="add-user" data-show="app-settings">
            <div>
                <div><label for="name">Username</label></div>
                <div><input type="text" name="name" id="name" required tabindex="0"></div>
            </div>
            <div>
                <div><label for="passwd">Password</label></div>
                <div>
                    <input type="password" name="passwd" id="password" required tabindex="0">
                    <button class="main-ui-btn hover right" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false" data-msg="Toggle password visibility">Show</button>
                </div>
            </div>
            <div>
                <div><label for="re-passwd">Confirm password</label></div>
                <div>
                    <input type="password" name="re-passwd" id="re-passwd" required tabindex="0">
                    <button class="main-ui-btn hover right" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false" data-msg="Toggle password visibility">Show</button>
                </div>
            </div>
            <div id="add-user-role-div">
                <div><label for="role"></label></div>
                <div>
                    <select name="role" id="role" tabindex="0">
                        <option value="all" selected>All</option>
                        <option value="bill">Billing</option>
                        <option value="purchase">Purchase</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn hover bottom" type="submit" data-msg="Register new user" tabindex="0">Register</button>
                    <button type="button" data-cmd="back" data-show="app-settings" data-msg="Cancel and go back" class="hover bottom" tabindex="0">Cancel</button>
                </div>
            </div>
        </form>
    </template>
    <template id="session-management-template">
        <form onsubmit="saveSettings(event)" id="session-management" data-cmd="session-management" data-show="app-settings">
            <div>
                <div>
                    <label>App session</label>
                    <button class="main-ui-btn hover bottom" type="button" id="session-btn" data-enable="false" data-cmd="toggle-session-preference" data-msg="Toggle session management" tabindex="0">Enable</button>
                </div>
            </div>
            <div class="hide" id="session-management-div">
                <div>
                    <div>
                        <label for="expiry">Set session expiry</label>
                    </div>
                    <div>
                        <select name="expiry" id="expiry" tabindex="0">
                            <option value="1" selected>1 Hour</option>
                            <option value="3">3 Hours</option>
                            <option value="5">5 Hours</option>
                            <option value="8">8 Hours</option>
                            <option value="24">1 Day</option>
                        </select>
                    </div>
                </div>
            </div>
            <div>
                <button class="main-ui-btn hover bottom" type="submit" data-msg="Save session settings" tabindex="0">Done</button>
                <button type="button" data-cmd="back" data-show="app-settings" data-msg="Cancel and go back" class="hover bottom" tabindex="0">Cancel</button>
            </div>
        </form>
    </template>
    <template id="appearance-management-template">
        <form onsubmit="saveSettings(event)" id="appearance-management" class="page1" data-cmd="appearance-management" data-show="app-settings">
            <div>
                <div>
                    <label for="apply-theme">Select theme</label>
                </div>
                <div>
                    <select name="applyTheme" id="apply-theme" data-target="choosefile" oninput="showOrHideDiv(event)" onclick="event.stopPropagation()" tabindex="0">
                        <option value="false">Default</option>
                        <option value="true">Choose a file</option>
                    </select>
                </div>
            </div>
            <div class="hide" data-show="choosefile">
                <div>
                    <label for="file">Select a file</label>
                </div>
                <div>
                    <input type="text" name="file" id="file" tabindex="0">
                    <button class="main-ui-btn hover right" type="button" onclick="chooseFile(event,{name: 'Theme File',extensions:['bbstheme']})" data-msg="Select theme file" tabindex="0">Choose</button>
                </div>
            </div>
            <div>
                <div>
                    <label for="useDarkTheme">Use dark theme</label>
                    <input type="checkbox" name="useDarkTheme" id="useDarkTheme" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="useWeatherTheme">Use weather theme</label>
                    <input type="checkbox" name="useWeatherTheme" id="useWeatherTheme" tabindex="0">
                </div>
            </div>
            <div>
                <button class="main-ui-btn hover bottom" type="button" data-show="app-settings" data-cmd="advance-theming" data-msg="Open advanced theme customization" tabindex="0">Advance theming options</button>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn hover bottom" type="submit" data-msg="Save appearance settings" tabindex="0">Save</button>
                    <button type="button" data-cmd="back" data-show="app-settings" data-msg="Cancel and go back" class="hover bottom" tabindex="0">Cancel</button>
                </div>
            </div>
        </form>
    </template>
    <template id="advance-theming-template">
        <form onsubmit="saveSettings(event)" id="adv-theme-page" class="page2" data-cmd="adv-appearance-management">
            <div>
                <div>
                    <h2>Light Theme</h2>
                    <div>
                        <div>
                            <label for="primary">Primary color</label>
                            <input type="color" name="primary" id="primary" tabindex="0">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="font">Font color</label>
                            <input type="color" name="text" id="font" tabindex="0">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="shadow">Shadow color</label>
                            <input type="color" name="shadow" id="shadow" tabindex="0">
                        </div>
                    </div>
                </div>
                <div>
                    <h2>Dark Theme</h2>
                    <div>
                        <div>
                            <label for="dark-primary">Primary color</label>
                            <input type="color" name="darkPrimary" id="dark-primary" tabindex="0">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="dark-font">Font color</label>
                            <input type="color" name="darkText" id="dark-font" tabindex="0">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="dark-shadow">Shadow color</label>
                            <input type="color" name="darkShadow" id="dark-shadow" tabindex="0">
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="applyGradient">Apply gradient color</label>
                    <input type="checkbox" name="applyGradient" id="applyGradient" onclick="event.stopPropagation()" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="applyBackgroundImage">Apply background image</label>
                    <input type="checkbox" data-target="choosefile" name="applyBackgroundImage" id="applyBackgroundImage" oninput="showOrHideDiv(event)" onclick="event.stopPropagation()" tabindex="0">
                </div>
            </div>
            <div class="hide" data-show="choosefile">
                <div>
                    <label for="file">Select a file</label>
                </div>
                <div>
                    <input type="text" name="file" id="file" tabindex="0">
                    <button class="main-ui-btn hover right" type="button" onclick="chooseFile(event,{name: 'Image File',extensions:['svg','jpg','png']})" data-msg="Select background image" tabindex="0">Choose</button>
                </div>

                </div>
                <div>
                    <input type="text" name="placeOfJurisdiction" id="placeOfJurisdiction" placeholder="Place of Jurisdiction" tabindex="0">
                </div>
            </div>
        </div>
    </template>
    <template id="info-type-bank-template">
        <div class="bank info">
        </div>
    </template>
    <template id="info-type-email-template">
        <div class="email info">
            <div>
                <div><label for="email">Company email</label></div>
                <div><input type="email" name="email" id="email" tabindex="0"></div>
            </div>
            <div>
                <div><label for="website">Company Website</label></div>
                <div><input type="url" name="website" id="website" tabindex="0"></div>
            </div>
        </div>
    </template>
    <template id="bank-info-form-template">
        <div class="bank-form">
            <div class="form">
                <div>
                    <div>
                        <label for="name">Bank Name</label>
                    </div>
                    <div>
                        <input type="text" name="name" id="bnk-name" tabindex="0">
                    </div>
                </div>
                <div>
                    <div>
                        <label for="branch">Branch Name</label>
                    </div>
                    <div>
                        <input type="text" name="branch" id="branch" tabindex="0">
                    </div>
                </div>
                <div>
                    <div>
                        <label for="acc-no">Account Number</label>
                    </div>
                    <div>
                        <input type="text" name="acc-no" id="acc-no" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)" tabindex="0">
                    </div>
                </div>
                <div>
                    <div>
                        <label for="ifsc">IFSC</label>
                    </div>
                    <div>
                        <input type="text" name="ifsc" id="ifsc" tabindex="0">
                    </div>
                </div>
                <div>
                    <button type="button" onclick="addBank(event)" data-msg="Add bank details" class="hover bottom" tabindex="0">Add Bank</button>
                </div>
            </div>
            <h2 class="hide">List of Banks</h2>
            <div class="host hide" onclick="event.stopPropagation();manageBank(event)">
            </div>
        </div>
    </template>
    <template id="bank-info-template">
        <div class="bank-info">
            <h3 data-col="name"></h3>
            <div class="inner">
                <p data-col="acc-no"></p>
                <p data-col="ifsc"></p>
                <p data-col="branch"></p>
            </div>
            <div>
                <button type="button" data-cmd="edit" data-msg="Edit bank details" class="hover left" tabindex="0">Edit</button>
                <button type="button" data-cmd="delete" data-msg="Delete bank" class="hover left" tabindex="0">-</button>
            </div>
        </div>
    </template>
    <template id="progressbar-template">
        <div id="progressbar" class="progressbar">
            <div>
                <h2 id="progress-text" for="progress"></h2>
                <p id="progress-context"></p>
                <span id="percentage"></span>
            </div>
            <div>
                <progress id="progress" max="100"></progress>
            </div>
            <div class="btn-container">
                <button id="progress-pause-btn" class="hide hover bottom" data-cmd="pause" data-msg="Pause/Resume" data-paused="false" tabindex="0">Pause</button>
                <button id="progress-cancel-btn" class="hide hover bottom" data-cmd="cancel" data-msg="Cancel operation" tabindex="0">Cancel</button>
            </div>
        </div>
    </template>
    <template id="product-info-fillup-modal-template">
        <form name="prodct-info-form">
            <h2>
                Item: <span id="prod-name"></span>
            </h2>
            <div id="container"></div>
            <div class="btn-container" onclick="prodFormAction(event)">
                <button type="button" data-cmd="close" data-msg="Close without saving" class="hover top" tabindex="0">Close</button>
                <button type="button" data-cmd="Skip" data-msg="Skip this item" class="hover top" tabindex="0">Skip Item</button>
                <button type="submit" data-msg="Save product information" class="hover top" tabindex="0">Save</button>
            </div>
        </form>
    </template>
    <template id="sample-form-input-template">
        <div>
            <div>
                <label for=""></label>
            </div>
            <div>
                <input type="" name="" id="" tabindex="0">
            </div>
        </div>
    </template>
    <template id="dot-loader-template">
        <div class="dot-loader">
            <span></span><span></span><span></span>
        </div>
    </template>
</body>
</html>
