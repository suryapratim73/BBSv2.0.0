<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/mainPage.js" defer></script>
    <link rel="stylesheet" href="../../images/fontawesome-free-6.1.1-web/css/all.min.css">
    <link rel="stylesheet" href="../css/mainPage.css">
</head>
<body>
    <div id="nav-div" onclick="modeSwitcher(event)">
        <div>
            <h1>BBS</h1>
        </div>
        <div>
            <p data-cmd="overview">Overview</p>
            <p data-cmd="sale">Sale</p>
            <p data-cmd="purchase">Purchase</p>
        </div>
        <div>
            <p data-cmd="settings">Settings</p>
            <!-- <p data-cmd="help">Help</p> -->
            <p data-cmd="logout">Logout</p>
            <p data-cmd="lock">Lock</p>
        </div>
    </div>
    <div id="main-div">
        <div>
            <h1 id="gretings-header"></h1>
            <div>
                <div>
                    <h2>Overview</h2>
                    <div id="sale-purchase-btn-div">
                        <div>
                            <button onclick="ipcRenderer.send('open-bills-folder')">Bills </button>
                            <button onclick="ipcRenderer.send('new-sale-purchase',1)">Create Sale</button>
                            <button class="fa-sharp fa-solid fa-caret-down drop-down-btn" onclick="document.querySelector('.drop-down').classList.toggle('hide');"></button>
                            <div>
                                <div class="drop-down hide">
                                    <div>
                                        <a href="#" onclick="ipcRenderer.send('new-sale-purchase',3)">Create new order</a>
                                    </div>
                                    <div>
                                        <a href="#" onclick="ipcRenderer.send('new-sale-purchase',4)">Update order</a>
                                    </div>
                                    <div>
                                        <a href="#">Update "Open" bills</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button onclick="ipcRenderer.send('new-sale-purchase',2)">Register Purchase</button>
                    </div>
                </div>
                <div id="mode-host" oncontextmenu="showContextMenu(event)">
                    <!-- work in progress -->
                </div>
            </div>
        </div>
        <div id="right-div">
            <div id="knob" onclick="expandOrCollapsePanel()"></div>
            <div id="panel" class="collapse-panel" data-collapsed="true">
                <div>
                    <h2>Notifications</h2>
                </div>
                <div id="notification-div" class="hide-scrollbar" onclick="notificationAction(event)"></div>
                <div class="btn-div">
                    <button data-cmd="clear">Clear</button>
                </div>
            </div>
        </div>
    </div>
    <template id="overview-page-template">
        <div id="overview-div" class="mode-content">
            <div ondblclick="dblClickHandler(event)">
                <div class="table hide" id="order-table-div">
                    <h3>Unbilled orders</h3>
                    <div class="row head">
                        <div class="col eq-space"><p data-col="slNo">Sl No</p></div>
                        <div class="col eq-space"><p data-col="billDate">Date</p></div>                        
                        <div class="col eq-space"><p data-col="name">Customer Name</p></div>
                        <div class="col eq-space"><p data-col="netAmtTax">Amount</p></div>
                        <div class="col eq-space"><p data-col="paymentStatus">Payment Status</p></div>
                        <div class="col eq-space"><p data-col="status">Order Status</p></div>
                    </div>
                    <div class="tbody hide-scrollbar"></div>
                </div>
                <div class="table" id="expired-bill-table-div">
                    <div>
                        <h3>Expired Bills</h3>
                        <select name="finYear" id="fin-year" onchange="overviewPageInit()">
                            <option value="0" selected>Current Financial Year</option>
                            <option value="1">Last Financial Year</option>
                            <option value="2">All Financial Year</option>
                        </select>
                    </div>
                    <div class="row head">
                        <div class="col eq-space"><p data-col="billNo">Bill Number</p></div>
                        <div class="col eq-space"><p data-col="billDate">Bill Date</p></div>
                        <div class="col eq-space"><p data-col="name">Customer Name</p></div>
                        <div class="col eq-space"><p data-col="billAmt">Bill Amount</p></div>
                    </div>
                    <div class="tbody hide-scrollbar"></div>
                </div>
            </div>
            <div>
                <div>
                    <div id="stock-div" class="table">
                        <h3>Stocks running low</h3>
                        <div class="row head">
                            <div class="col eq-space"><p data-col="name">Name</p></div>
                            <div class="col eq-space"><p data-col="quantity">Quantity</p></div>
                        </div>
                        <div class="tbody hide-scrollbar">
                        </div>
                    </div>
                </div>
                <div id="scheduler-div" onclick="openScheduleManager(event)" onmouseenter="clearInterval(caroselTimer)" onmouseleave="carosel([...document.querySelectorAll('.event-page')],0)">
                    <div class="event-page first-page">
                        <div class="event-div">
                            <div id="dt-div">
                                <h1></h1>
                                <p></p>
                            </div>
                        </div>
                        <div class="btn-container">
                            <button data-cmd="call-scheduler" data-msg="Add New Event" class="hover right top">+</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="quick-host-template">
        <div id="quick-host">
            <div>
                <button onclick="backAction(event)" class="main-ui-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </button>
            </div>
            <div id="host"></div>
        </div>
    </template>
    <template id="bill-display-template">
        <div class="mode-content">
            <div>
                <div class="table">
                    <div class="row head">
                        <div class="col eq-space"><p>Sl. No.</p></div>
                        <div class="col eq-space"><p>Particular</p></div>
                        <div class="col eq-space"><p>Quantity</p></div>
                        <div class="col eq-space"><p>Rate</p></div>
                    </div>
                    <div class="tbody hide-scrollbar">
                    </div>
                </div>
            </div>
            <div>
                <div id="bil-meta" class="side-divs"></div>
                <div id="customer-meta" class="side-divs"></div>
            </div>
        </div>
    </template>
    <template id="sale-page-template">
        <div class="mode-content" id="sale-div">
            <div id="sale-div-content" onmouseenter="saleOverviewContext()" onmouseleave='document.getElementById("overview-context").classList.add("hide");document.getElementById("context-options").classList.add("hide")'>
                <div id="overview-context" class="hide">
                    <div class="icon-container" onclick="showContextOptions()">
                        <i data-msg="Change widget" class="hover">&#8635;</i>
                    </div>
                    <div class="hide" id="context-options" onclick="updateSaleOverviewPreference(event)">
                        <p data-name="orderQueue">Order Queues</p>
                        <p data-name="monthly1x">Monthly Sale - Current Month</p>
                        <p data-name="monthly3x">Monthly Sale - Last 3 Months</p>
                    </div>
                </div>
            </div>
            <div>
                <div id="sale-graph-div">
                    <div>
                        <h3>Sale chart</h3>
                        <canvas id="sale-graph"></canvas>
                    </div>
                    <div>
                        <label>Change chart period</label>
                        <select onchange="updateChart(event,'#sale-graph')">
                            <option value="year" data-mode="3">Year</option>
                            <option value="month" data-mode="2">Month</option>
                            <option value="day" data-mode="1" selected>Day</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="sale-table-template">
        <div id="sale-table" class="widget">
            <div class="table">
                <div class="row head">
                    <p class="col eq-space" data-col="billDate">Date</p>
                    <p class="col eq-space" data-col="name">Name</p>
                    <p class="col eq-space" data-col="netAmt">Bill Amount</p>
                    <p class="col eq-space" data-col="paymentStatus">Paid / Unpaid</p>
                </div>
                <div class="tbody hide-scrollbar"></div>
            </div>
        </div>
    </template>
    <template id="order-queue-container-template">
        <div id="order-queue-container" class="widget" onclick="slideQueueCard(event)">
            <h3>Order Queues</h3>
        </div>
    </template>
    <template id="purchase-page-template">
        <div id="purchase-div" class="mode-content">
            <div id="current-purchase">
                <div class="table">
                    <h3>Today's purchases'</h3>
                    <div class="row head">
                        <div class="col eq-space"><p>Bill Number</p></div>
                        <div class="col eq-space"><p>Bill Date</p></div>
                        <div class="col eq-space"><p>Supplier Name</p></div>
                        <div class="col eq-space"><p>Bill Amount</p></div>
                    </div>
                    <div class="tbody hide-scrollbar">
                    </div>
                </div>
            </div>
            <div>
                <div id="purchase-graph-div">
                    <div>
                        <h3>Purchase Chart</h3>
                        <canvas id="purchase-graph"></canvas>
                    </div>
                    <div><label>Change chart period</label>
                        <select onchange="updateChart(event,'#purchase-graph')">
                            <option value="year" data-mode="3">Year</option>
                            <option value="month" data-mode="2">Month</option>
                            <option value="day" data-mode="1" selected>Day</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </template>
    <template id="settings-page-template">
        <div id="settings-div" class="mode-content">
            <nav onclick="switchSettingsNav(event)">
                <p data-mode="app-settings" class="selected">App</p>
                <p data-mode="billing-settings">Company & Billing</p>
            </nav>
            <main id="main">
                <h1>Settings</h1>
                <div id="settings-container" onclick="showForm(event)">
                    <div class="settings" data-mode="app-settings" id="app-settings">
                        <h2>App Settings</h2>
                        <div class="settings-div">
                            <p data-cmd="set-2-factor-auth" data-show="app-settings" data-msg="Unlock using password and any authenticator app.">Set 2 factor authentication</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="enable-disable-sms-notification" data-msg="SMS notification helps you to notify customer about their due payment but will cost you some money per month based on your usage.">SMS Notification</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="lock-screen" data-msg="Change lock screen background.">Lock screen</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="add-user" data-msg="Add users of this software and assign role to them.">Add user</p>
                            <p class="bill purchase" data-show="app-settings" data-cmd="update-user" data-msg="Update user privilege and password.">Update user</p>
                            <p data-cmd="session-management" data-show="app-settings" data-msg="Configure lock behaviour and session persistence.">Session management</p>
                            <p data-cmd="appearance-management" data-show="app-settings" data-msg="Configure app appearance and theming of BBS..">Appearance management</p>
                            <!-- <p data-cmd="network-management" data-show="app-settings" data-msg="Configure nodes in your network.">Network management</p> -->
                            <p class="bill purchase" data-cmd="backup-manager" data-show="app-settings" data-msg="Local or cloud based backup settings.">Backup manager</p>
                            <!-- <p class="bill purchase" data-cmd="general" data-show="app-settings" data-msg="Define settings like Financial year wise data">General App Setting</p> -->
                            <!-- <p class="bill purchase" data-cmd="registration" data-show="app-settings" data-msg="App registration.">App registration</p> -->
                        </div>
                    </div>
                    <div class="settings hide" data-mode="company-settings" id="company-settings">
                        <h2>Company settings</h2>
                        <div class="settings-div">
                            <p></p>
                        </div>
                    </div>
                    <div class="settings hide" data-mode="billing-settings" id="billing-settings">
                        <h2>Bill settings</h2>
                        <div class="settings-div">
                            <p data-cmd="company-profile" data-show="billing-settings" data-msg="Edit company profile.">Company profile</p>
                            <p data-cmd="bill-template" data-show="billing-settings" data-msg="Setting related to Bill PDF customization.">Bill template</p>
                            <p data-cmd="bill-no" data-show="billing-settings" data-msg="Define bill number format and set bill no">Invoice numbering</p>
                            <p data-cmd="gst-setting" data-show="billing-settings" data-msg="Define filing GST Intervals,financial year and other relevant Informations">GST Settings</p>
                            <p data-cmd="company-setting" data-show="billing-settings" data-msg="Define company policies and holidays">Company Settings</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </template>
    <template id="set-2-factor-auth-template">
        <form onsubmit="saveSettings(event)" id="set-2-factor-auth-form" data-cmd="set-2-factor-auth" data-show="app-settings">
            <div>
                <div>
                    <div>
                        <button class="main-ui-btn" type="button" data-cmd="enable-2-factor" id="enable-2-factor" disabled>Enable 2-Factor Authentication</button>
                    </div>
                </div>
                <div>
                    <div>
                        <button type="submit" class="main-ui-btn" id="done-btn" disabled>Done</button>
                        <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
                        <button type="button" id="disable-2-factor" disabled data-cmd="disable-2-factor" data-show="app-settings">Disable 2-Factor Authentication</button>
                    </div>
                </div>
            </div>
            <div>
                <div id="qrcode-div">
                    <img>
                </div>
            </div>
        </form>
    </template>
    <template id="lock-screen-template">
        <form onsubmit="saveSettings(event)" onchange="changeHandler(event)" id="lock-screen" data-cmd="lock-screen" data-show="app-settings">
            <div>
                <div><label for="file-path">Choose a image file</label></div>
                <div>
                    <input type="text" name="filePath" id="file-path">
                    <button type="button" class="main-ui-btn" onclick="chooseFile(event)">Choose</button>
                </div>
            </div>
            <div>
                <div><label for="usePasswd">Use password</label></div>
                <div>
                    <select name="usePasswd" id="usePasswd">
                        <option value="true">Yes</option>
                        <option value="false" selected>No</option>
                    </select>
                </div>
            </div>
            <div>
                <div><label for="lockOnIdle">Lock on idle</label></div>
                <div>
                    <select name="lockOnIdle" id="lockOnIdle" data-target="idleTime">
                        <option value="true">Yes</option>
                        <option value="false" selected>No</option>
                    </select>
                </div>
            </div>
            <div>
                <div><label for="idleTime">Idle trigger time</label></div>
                <div>
                    <input type="text" name="idleTime" id="idleTime" placeholder="Time in minutes" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)">
                </div>
            </div>
            <div>
                <button class="main-ui-btn type="submit">Save</button>
                <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
            </div>
        </form>
    </template>
    <template id="add-user-template">
        <form onsubmit="saveSettings(event)" id="add-user" data-cmd="add-user" data-show="app-settings">
            <div>
                <div><label for="name">Username</label></div>
                <div><input type="text" name="name" id="name" required></div>
            </div>
            <div>
                <div><label for="passwd">Password</label></div>
                <div>
                    <input type="password" name="passwd" id="password" required>
                    <button class="main-ui-btn" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false">Show</button>
                </div>
            </div>
            <div>
                <div><label for="re-passwd">Confirm password</label></div>
                <div>
                    <input type="password" name="re-passwd" id="re-passwd" required>
                    <button class="main-ui-btn" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false">Show</button>
                </div>
            </div>
            <div id="add-user-role-div">
                <div><label for="role"></label></div>
                <div>
                    <select name="role" id="role">
                        <option value="all" selected>All</option>
                        <option value="bill">Billing</option>
                        <option value="purchase">Purchase</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn" type="submit">Register</button>
                    <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
                </div>
            </div>
        </form>
    </template>
    <template id="session-management-template">
        <form onsubmit="saveSettings(event)" id="session-management" data-cmd="session-management" data-show="app-settings">
            <div>
                <div>
                    <label>App session</label>
                    <button class="main-ui-btn" type="button" id="session-btn" data-enable="false" data-cmd="toggle-session-preference">Enable</button>
                </div>
            </div>
            <div class="hide" id="session-management-div">
                <div>
                    <div>
                        <label for="expiry">Set session expiry</label>
                    </div>
                    <div>
                        <select name="expiry" id="expiry">
                            <option value="1" selected>1 Hour</option>
                            <option value="3">3 Hours</option>
                            <option value="5">5 Hours</option>
                            <option value="8">8 Hours</option>
                            <option value="24">1 Day</option>
                        </select>
                    </div>
                </div>
            </div>
            <div>
                <button class="main-ui-btn type="submit">Done</button>
                <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
            </div>
        </form>
    </template>
    <template id="appearance-management-template">
        <form onsubmit="saveSettings(event)" id="appearance-management" class="page1" data-cmd="appearance-management" data-show="app-settings">
            <div>
                <div>
                    <label for="apply-theme">Select theme</label>
                </div>
                <div>
                    <select name="applyTheme" id="apply-theme" data-target="choosefile" oninput="showOrHideDiv(event)" onclick="event.stopPropagation()">
                        <option value="false">Default</option>
                        <option value="true">Choose a file</option>
                    </select>
                </div>
            </div>
            <div class="hide" data-show="choosefile">
                <div>
                    <label for="file">Select a file</label>
                </div>
                <div>
                    <input type="text" name="file" id="file">
                    <button class="main-ui-btn type="button" onclick="chooseFile(event,{name: 'Theme File',extensions:['bbstheme']})">Choose</button>
                </div>
            </div>
            <div>
                <div>
                    <label for="useDarkTheme">Use dark theme</label>
                    <input type="checkbox" name="useDarkTheme" id="useDarkTheme">
                </div>
            </div>
            <div>
                <button class="main-ui-btn" type="button" data-show="app-settings" data-cmd="advance-theming">Advance theming options</button>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn" type="submit">Save</button>
                    <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
                </div>
            </div>
        </form>
    </template>
    <template id="advance-theming-template">
        <form onsubmit="saveSettings(event)" id="adv-theme-page" class="page2" data-cmd="adv-appearance-management">
            <div>
                <div>
                    <h2>Light Theme</h2>
                    <div>
                        <div>
                            <label for="primary">Primary color</label>
                            <input type="color" name="primary" id="primary">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="secondary">Secondary color</label>
                            <input type="color" name="secondary" id="secondary">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="font">Font color</label>
                            <input type="color" name="text" id="font">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="shadow">Shadow color</label>
                            <input type="color" name="shadow" id="shadow">
                        </div>
                    </div>
                </div>
                <div>
                    <h2>Dark Theme</h2>
                    <div>
                        <div>
                            <label for="dark-primary">Primary color</label>
                            <input type="color" name="darkPrimary" id="dark-primary">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="dark-secondary">Secondary color</label>
                            <input type="color" name="darkSecondary" id="dark-secondary">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="dark-font">Font color</label>
                            <input type="color" name="darkText" id="dark-font">
                        </div>
                    </div>
                    <div>
                        <div>
                            <label for="dark-shadow">Shadow color</label>
                            <input type="color" name="darkShadow" id="dark-shadow">
                        </div>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <label for="applyGradient">Apply gradient color</label>
                    <input type="checkbox" name="applyGradient" id="applyGradient" onclick="event.stopPropagation()">
                </div>
            </div>
            <div>
                <div>
                    <label for="applyBackgroundImage">Apply background image</label>
                    <input type="checkbox" data-target="choosefile" name="applyBackgroundImage" id="applyBackgroundImage" oninput="showOrHideDiv(event)" onclick="event.stopPropagation()">
                </div>
            </div>
            <div class="hide" data-show="choosefile">
                <div>
                    <label for="file">Select a file</label>
                </div>
                <div>
                    <input type="text" name="file" id="file">
                    <button class="main-ui-btn" type="button" onclick="chooseFile(event,{name: 'Image File',extensions:['svg','jpg','png']})">Choose</button>
                </div>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn" type="submit">Save</button>
                    <button type="button" data-cmd="back-page1" data-show="page1">Cancel</button>
                    <button type="button" data-cmd="reset-color">Reset colors</button>
                </div>
            </div>
        </form>
    </template>
    <template id="update-user-template">
        <form onsubmit="saveSettings(event)" id="update-user" data-cmd="update-user" data-show="app-settings">
            <div>
                <div><label for="name">Select user</label></div>
                <div><input type="text" id="name-2" name="name" list="user-list"></div>
            </div>
            <div>
                <div><label for="old-password">Enter existing password</label></div>
                <div>
                    <input type="password" name="old-password" id="old-password">
                    <button data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false">Show</button>
                </div>
            </div>
            <div>
                <div><label for="password">Enter new password</label></div>
                <div>
                    <input type="password" name="password" id="password">
                    <button class="main-ui-btn" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false">Show</button>
                </div>
            </div>
            <div>
                <div><label for="re-password">Re-enter password</label></div>
                <div>
                    <input type="password" name="re-password" id="re-password">
                    <button class="main-ui-btn" data-cmd="toggle-visibility" tabindex="-1" type="button" data-show="false">Show</button>
                </div>
            </div>
            <div id="role-div">
                <div><label for="role">Role</label></div>
                <div>
                    <select name="role" id="role">
                        <option value="all" selected>All</option>
                        <option value="bill">Billing</option>
                        <option value="purchase">Purchase</option>
                    </select>
                </div>
            </div>
            <div>
                <button class="main-ui-btn" type="submit">Save</button>
                <button type="button" data-cmd="back" data-show="app-settings">Cancel</button>
            </div>
        </form>
    </template>
    <template id="backup-manager-template">
        <form onsubmit="saveSettings(event)" id="backup-manager" data-cmd="backup-manager" data-show="app-settings">
            <p>Select items for backup</p>
            <div>
                <div>

            </div>

                </div>

            </div>
            <div class="hide" data-show="choosefile-3">

                    <label for="file-3">Select a file</label>
                </div>

    <template id="gst-setting-template">

                    <label for="gst-interval">GST Filing Interval</label>

            </div>
        </form>

    <template id="company-setting-template">
        <form onsubmit="saveSettings(event)" class="page1" id="company-setting" data-cmd="company-setting" data-show="billing-settings">
            <div>
                <div class="left-sec">
                    <div>
                        <label for="add-date">Add Annual Holidays</label>
                    </div>
                    <div>
                        <input type="date" id="add-date">
                        <button type="button" data-cmd="annualHolidays">Add To Annual Holidays</button>
                    </div>
                </div>
                <div id="annualHolidays" class="right-sec">
                    <textarea name="annualHolidays" id="annualHolidays-textarea" spellcheck="false" placeholder="Write comma separated dates in dd/mm/yyyy. Note any invalid entries will be scrapped."></textarea>
                </div>
            </div>
            <div>
                <div class="left-sec">
                    <div>
                        <label for="add-date">Add Weekly Holidays</label>
                    </div>
                    <div>
                        <select>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                            <option value="0">Sunday</option>
                        </select>

                    </div>

                    <textarea name="weeklyHolidays" id="weeklyHolidays-textarea" spellcheck="false" placeholder="Write weekly off-days."></textarea>

            <div>
                <div>
                    <label for="ret-days">Add Maxium Returnable Days</label>
                </div>

                    <input type="text" id="ret-days" name="noReturn" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)"> <i> Days</i>
                </div>
            </div>
            <div>
                <div>
                    <label for="creditLimitDays">Default Customer Credit Period</label>
                </div>

                    <input type="text" name="creditLimitDays" id="creditLimitDays" data-type="Number" data-subtype="price" onkeypress="validateInput2(event)"><i> Days</i>
                </div>
            </div>
            <div>
                <button class="main-ui-btn page1" type="submit">Save</button>
                <button type="button" data-cmd="back" data-show="billing-settings">Cancel</button>
            </div>

    <template id="bill-no-template">

                </div>

    <template id="adv-invoice-format-template">
        <form onsubmit="saveSettings(event)" class="page2" id="adv-bill-no" data-cmd="adv-bill-no" data-show="billing-settings">
            <div>
                <div>
                    <label for="formats">Select a format</label>
                </div>
                <div>
                    <select name="formats" onclick="event.stopPropagation()" id="formats" data-cmd="invoice-format" onchange="changeHandler(event)">
                        <option value="1">Bill number(billNo)</option>
                        <option value="2">Financial year(fy)/Bill number(billNo)</option>
                        <option value="3">Your company abbrebiation(cabbr)/Financial year(fy)/Bill number(billNo)</option>
                        <option value="0">Custom format</option>
                    </select>
                </div>
            </div>
            <div class="hide" id="custom-format-div">
                <div>
                    <label for="custom">Custom invoice number</label>
                </div>
                <div>
                    <p>Sample</p>
                </div>
                <div>
                    <input type="text" onkeypress="event.preventDefault()" value="" id="custom-format-display" name="custom-format">
                </div>
                <div>
                    <select name="element" id="element">
                        <option value="billNo">Bill Number(billNo)</option>
                        <option value="cabbr">Company abbrebiation(cabbr)</option>
                        <option value="fy">Financial year(fy)</option>
                        <option value="batchNo">Batch number(batchNo)</option>
                        <option value="-">Separator 1 (-)</option>
                        <option value="/">Separator 2 (/)</option>
                        <option value=".">Separator 3 (.)</option>
                        <option value="\\">Separator 4 (\)</option>
                        <option value="_">Separator 5 (_)</option>
                    </select>
                    <button type="button" onclick="appendElem()">Append</button>
                </div>
            </div>
            <div>
                <button class="main-ui-btn" type="submit">Save</button>
                <button type="button" data-cmd="back-page1" data-show="page1">Cancel</button>
            </div>
        </form>
