<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/serviceRegistor.css">
    <script src="../js/serviceRegistor.js" defer></script>
</head>
<body>
    <nav role="navigation" aria-label="Service register navigation">
        <button class="main-ui-btn page1-elem hide" data-cmd="new-service" aria-label="Add new service" tabindex="0">Add New Service</button>
        <button class="main-ui-btn page2-elem hide" data-cmd="back" aria-label="Go back" tabindex="0">Back</button>
        <input class="page1-elem hide" type="text" name="" id="" aria-label="Search services" tabindex="0">
    </nav>
    <main role="main">
        <div class="table page1-elem page hide" role="table" aria-label="Services list table">
            <div class="row head" role="row">
                <p class="col eq-space" role="columnheader">Sl No.</p>
                <p class="col eq-space" role="columnheader">Name</p>
                <p class="col eq-space">Rate</p>
                <p class="col eq-space">Unit</p>
            </div>
            <div class="tbody" role="rowgroup"></div>
        </div>
    </main>
    <template id="body-row-template">
        <div class="body row">
            <p class="col eq-space" data-colname="entryNo"></p>
            <p class="col eq-space" data-colname="name"></p>
            <p class="col eq-space" data-colname="standardSellPrice"></p>
            <p class="col eq-space" data-colname="unit"></p>
        </div>
    </template>
    <template id="service-registor-modal-template">
        <form onsubmit="addNewService(event)" class="modal-page page1">
            <div>
                <h2>New Service Form</h2>
            </div>
            <div>
                <div><label for="name">Service Name</label></div>
                <div><input required type="text" id="name" name="name" tabindex="0"></div>
            </div>
            <div>
                <div><label for="rate">Rate</label></div>
                <div><input required type="text" id="rate" name="rate" tabindex="0"></div>
            </div>
            <div>
                <div><label for="unit">Unit</label></div>
                <div><input required type="text" id="unit" name="unit" tabindex="0"></div>
            </div>
            <div>
                <div><label for="hsn">HSN</label></div>
                <div><input required type="text" id="hsn" name="hsn" tabindex="0"></div>
            </div>
            <div>
                <div>
                    <button class="main-ui-btn type="button" onclick="addFeild(event)" tabindex="0">Add Feilds</button>
                    <div id="more-feild-menu" class="hide" onclick="showOrHideFeildDiv(event)">
                        <div class="dash-mark"></div>
                        <div class="dash-mark"></div>
                        <div class="dash-mark"></div>
                        <div class="hide" id="more-feild-div"></div>
                    </div>
                </div>
            </div>
            <div>
                <button class="main-ui-btn" type="submit" tabindex="0">Add</button>
                <button type="button" onclick="closeModal()" tabindex="0">Cancel</button>
            </div>
        </form>
    </template>
    <template id="add-feild-template">
        <form id="add-feild" class="modal-page page2" onsubmit="addNewFeild(event)">
            <div>
                <div>
                    <label for="key">Feild Name</label>
                </div>
                <div>
                    <input type="text" required id="key" name="key" tabindex="0">
                </div>
            </div>
            <div>
                <div>
                    <label for="val">Feild Value</label>
                </div>
                <div>
                    <input type="text" required id="val" name="val" tabindex="0">
                </div>
            </div>
            <div>
                <button class="main-ui-btn" type="submit" tabindex="0">Add</button>
                <button type="button" onclick="closeAddFeild(event)" tabindex="0">Cancel</button>
            </div>
        </form>
    </template>
    <template id="feild-template">
        <div>
            <p data-colname="key"></p>
            <p data-colname="val"></p>
        </div>
    </template>
    <template id="page2-template">
        <div class="page page2-elem">
            <div>
                <div>
                    <div>
                        <p>Name</p>
                    </div>
                    <div>
                        <input type="text" data-colname="name" disabled tabindex="0" />
                    </div>
                </div>
                <div>
                    <div>
                        <p>HSN</p>
                    </div>
                    <div>
                        <input type="text" data-colname="hsn" disabled tabindex="0" />
                    </div>
                </div>
                <div>
                    <div>
                        <p>Rate per unit</p>
                    </div>
                    <div>
                        <input type="text" data-colname="standardSellPrice" disabled tabindex="0" />
                    </div>
                </div>
                <div>
                    <div>
                        <p>Unit</p>
                    </div>
                    <div>
                        <input type="text" data-colname="unit" disabled tabindex="0" />
                    </div>
                </div>
                <div>
                    <div>
                        <p>Service Type</p>
                    </div>
                    <div>
                        <input type="text" data-colname="type" disabled tabindex="0" />
                    </div>
                </div>
                <div>
                    <div>
                        <p>More Informations</p>
                    </div>
                    <div>
                        <div id="more-feild-menu" class="hide" onclick="showOrHideFeildDiv(event)">
                            <div class="dash-mark"></div>
                            <div class="dash-mark"></div>
                            <div class="dash-mark"></div>
                            <div class="hide" id="more-feild-div"></div>
                        </div>
                    </div>
                </div>
                <div>
                    <div class="btn-container" onclick="enableBTNs(event)">
                        <button class="main-ui-btn" data-mode="1" tabindex="0">Edit</button>
                        <button class="main-ui-btn hide" data-mode="save" tabindex="0">Save Changes</button>
                        <button class="hide" data-mode="2" tabindex="0">Cancel</button>
                    </div>
                </div>
            </div>
            <div>
                <div>
                    <canvas aria-label="Service usage graph"></canvas>
                </div>
                <div class="table">
                    <div class="row head">
                        <p class="col eq-space">Name</p>
                        <p class="col eq-space">Date</p>
                    </div>
                    <div class="tbody"></div>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
