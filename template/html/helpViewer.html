<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBS Help</title>
    <script src="../js/helpViewer.js" defer></script>
    <link rel="stylesheet" href="../css/helpViewer.css">
</head>
<body>
    <div id="help-toolbar">
        <input type="text" id="help-search" placeholder="Search help..." oninput="searchHelp()">
        <button onclick="closeWindow()" title="Close">✕</button>
    </div>
    <div id="help-content">
        <p class="loading">Loading help content…</p>
    </div>
</body>
</html>
