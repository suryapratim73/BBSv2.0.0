<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Handler</title>
    <link rel="stylesheet" href="../css/goodsReturn.css">
    <script src="../js/goodsReturn.js" defer></script>
</head>
<body>
    <div id="toggle" onclick="handleToggle(event)">
        <p data-section="customer">
            <span class="highlight">Customer</span>
        </p>
        <div class="slide">
            <div class="knob">
                <div class="dot"></div>
            </div>
        </div>
        <p data-section="supplier">
            <span>Supplier</span>
        </p>
    </div>
    <div id="supplier-bill-div" class="hide ret-bill-div">
        <h1>Add Supplier and Bill Detail</h1>
        <form onsubmit="handle_proceed(event)" oninput="searchHandler(event)">
            <div>
                <label for="supp-name">Enter supplier name</label>
                <input type="text" list="supplier-name" name="name" id="supp-name" tabindex="0" />
            </div>
            <div>
                <label for="supp-ret-date">Enter return date</label>
                <input type="date" name="ret-date" class="ret-date" id="supp-ret-date" tabindex="0" />
            </div>
            <div>
                <label for="supp-date">Enter purchase date/period</label>
                <input type="text" disabled name="date" id="supp-date" tabindex="0" />
            </div>
            <div>
                <label for="supp-billNo">Enter bill number</label>
                <input type="text" disabled name="billNo" onchange="assignBillDate(event)" list="billNo-list" id="supp-billNo" tabindex="0" />
            </div>
            <div><button type="submit" class="main-ui-btn hover bottom" data-msg="Retrieve supplier bill items" tabindex="0">Get Bill Items</button></div>
        </form>
    </div>
    <div id="customer-bill-div" class="ret-bill-div">
        <h1>Add Customer and Bill Detail</h1>
        <form onsubmit="handle_proceed(event)" oninput="searchHandler(event)">
            <div>
                <label for="name">Enter customer name</label>
                <input type="text" list="customer-name" name="name" id="name" tabindex="0" />
            </div>
            <div>
                <label for="ret-date">Enter return date</label>
                <input type="date" name="ret-date" class="ret-date" id="ret-date" tabindex="0" />
            </div>
            <div>
                <label for="date">Enter sale date/period</label>
                <input type="text" disabled name="date" id="date" tabindex="0" />
            </div>
            <div>
                <label for="billNo">Enter bill number</label>
                <input type="text" disabled name="billNo" onchange="assignBillDate(event)" list="billNo-list" id="billNo" tabindex="0" />
            </div>
            <div><button type="submit" class="main-ui-btn" tabindex="0" >Get Bill Items</button></div>
        </form>
    </div>
    <div id="page-2" class="hide">
        <div id="item-table" class="table">
            <div class="head row">
                <p data-name="date" class="col eq-space">Sl No</p>
                <p data-name="billNo" class="col eq-space">Item</p>
                <p data-name="billAmt" class="col eq-space">Quantity</p>
                <p data-name="payment" class="col eq-space">Rate</p>
                <p data-name="balance" class="col eq-space">Total</p>
            </div>
            <div id="tbody"></div>
        </div>  
        <div>
            <button data-cmd="add-item" data-msg="Add item to return list" class="hover bottom" tabindex="0">Add item</button>
            <button data-cmd="confirm-return" data-msg="Confirm and process return" class="hover bottom" tabindex="0">Confirm Return</button>
            <button data-cmd="back" data-msg="Go back to previous page" class="hover bottom" tabindex="0">Back</button>
        </div>  
    </div>
</body>
</html>
