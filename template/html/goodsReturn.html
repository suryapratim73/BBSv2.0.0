<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Handler</title>
    <link rel="stylesheet" href="../css/goodsReturn.css">
    <script src="../js/goodsReturn.js" defer></script>
</head>
<body>
    <div id="customer-bill-div">
        <h1>Add Customer and Bill Detail</h1>
        <form onsubmit="handle_proceed(event)" oninput="searchHandler(event)">
            <div>
                <label for="name">Enter customer name</label>
                <input type="text" list="customer-name" name="name" id="name" />
            </div>
            <div>
                <label for="name">Enter purchase date/period</label>
                <input type="text" disabled name="date" id="date" />
            </div>
            <div>
                <label for="billNo">Enter bill number</label>
                <input type="text" disabled name="billNo" onchange="assignBillDate(event)" list="billNo-list" id="billNo" />
            </div>
            <div><button type="submit">Get Bill Items</button></div>
        </form>
    </div>
    <div id="page-2" class="hide">
        <div id="item-table" class="table">
            <div class="head row">
                <p data-name="date" class="col col1">Sl No</p>
                <p data-name="billNo" class="col col2">Item</p>
                <p data-name="billAmt" class="col col3">Quantity</p>
                <p data-name="payment" class="col col4">Rate</p>
                <p data-name="balance" class="col col5">Total</p>
            </div>
        </div>  
        <div>
            <button>Add item</button>
            <button>Confirm Return</button>
        </div>  
    </div>
</body>
</html>
